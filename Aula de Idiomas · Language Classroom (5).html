h1,h2{font-family:"Poiret One",Georgia,serif;font-weight:400;margin:0}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 60px}
.gate{min-height:80vh;display:grid;place-items:center;text-align:center}
.gate h1{font-size:clamp(2rem,6vw,3.2rem);line-height:1.05;margin-bottom:8px}
.gate p{color:var(--mut);margin:0 0 20px}
input,select,button{font:inherit;color:inherit}
input[type=text],input[type=password],input[type=url],select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.1);width:100%}
.btn{background:var(--ink);color:var(--on);border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:700}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.err{color:var(--es);min-height:1.4em;font-size:.9rem;margin-top:8px}
header{background:var(--card);border-radius:26px;padding:12px 20px;box-shadow:0 6px 18px #0004;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:24px}
header h1{font-size:1.7rem}
.tools{display:flex;gap:10px;align-items:center}
.sw{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.sw button{border:0;background:none;padding:6px 14px;cursor:pointer;font-weight:700}
.sw button[aria-pressed=true]{background:var(--ink);color:var(--on)}
details.sec{background:var(--card);border:2px solid rgba(255,255,255,.18);border-radius:26px;margin-bottom:18px;box-shadow:0 6px 18px #0004}
details.sec>summary{list-style:none;cursor:pointer;padding:18px 20px;display:flex;justify-content:space-between;align-items:center}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary h2{font-size:1.6rem;color:var(--c)}
details.sec>summary::after{content:"+";font-size:1.6rem;color:var(--c)}
details.sec[open]>summary::after{content:"–"}
.subs{padding:0 20px 16px}
details.sub{border-top:1px solid var(--line)}
details.sub>summary{cursor:pointer;padding:12px 0;font-weight:700;display:flex;justify-content:space-between}
.cnt{color:var(--mut);font-weight:400;font-size:.85rem}
ul.items{list-style:none;margin:0;padding:0 0 12px;display:grid;gap:8px}
li.it{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
li.it .tag{font-size:.7rem;font-weight:700;background:var(--c);color:var(--on);border-radius:4px;padding:2px 6px}
li.it .ttl{flex:1;min-width:140px;font-weight:500}
li.it a{color:var(--c);font-weight:700}
li.it video{width:100%;border-radius:8px;margin-top:4px}
.empty{color:var(--mut);font-size:.9rem;padding-bottom:12px}
.add{display:grid;gap:8px;padding:12px;margin-bottom:12px;border:1px dashed var(--c);border-radius:8px}
.note{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:.9rem}
.hide{display:none!important}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);max-width:340px;width:90%}
dialog::backdrop{background:#0007}
h1,h2,summary,.btn,.tag,.sw button{text-transform:uppercase;letter-spacing:.07em}
option{color:#1c2a55}
::placeholder{color:var(--mut)}
.gate{position:relative}
#gf{background:var(--card);border-radius:30px;padding:28px 28px 32px;max-width:520px;width:100%;box-shadow:0 8px 24px #0005;position:relative;z-index:1}
.lg{width:210px;max-width:60%;display:block;margin:0 auto 6px}
.lg.sm{width:92px;margin:0}
.brand{display:flex;align-items:center;gap:12px}
.brand h1{font-size:1.5rem}
.deer{position:absolute;bottom:4vh;height:min(42vh,310px)}
.deer.l{left:-6px}.deer.r{right:-6px;transform:scaleX(-1)}
@media(max-width:700px){.deer{display:none}}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.2);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--es)}
</style>
</head>

const safeUrl=u=>/^https?:\/\//i.test(u);

function buildSecs(){
 const root=$("#secs");root.textContent="";
 SECS.forEach(([s,c])=>{
  const d=el("details",{class:"sec",id:"sec-"+s});d.style.setProperty("--c",c);
  d.append(el("summary",{},el("h2",{id:"h-"+s})));
  const subs=el("div",{class:"subs"});
  SUBS.forEach(b=>{
   const sd=el("details",{class:"sub",id:`sub-${s}-${b}`});sd.style.setProperty("--c",c);
   sd.append(el("summary",{},el("span",{id:`n-${s}-${b}`}),el("span",{class:"cnt",id:`c-${s}-${b}`})),el("div",{id:`f-${s}-${b}`}),el("ul",{class:"items",id:`l-${s}-${b}`}));
   subs.append(sd)});
  d.append(subs);root.append(d)});
}
function applyText(){
 document.documentElement.lang=lang;
 $$("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));
 $$("[data-ph]").forEach(e=>e.placeholder=t(e.dataset.ph));
 $$(".sw button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
 SECS.forEach(([s])=>{$("#h-"+s).textContent=t("s_"+s);SUBS.forEach(b=>$(`#n-${s}-${b}`).textContent=t(b))});
 $("#admBtn").textContent=admin?t("exit"):t("admin");meter();
 renderLists();
}
function note(msg){const n=$("#note");n.textContent=msg||"";n.classList.toggle("hide",!msg)}
async function meter(){const m=$("#meter");if(!admin||!assets){m.classList.add("hide");return}
 try{const u=(await assets.list()).usage,mb=n=>(n/1048576).toFixed(1),i=el("i");i.style.width=Math.min(100,u.bytes/u.maxBytes*100)+"%";
  m.textContent=`${t("used")}: ${mb(u.bytes)} MB ${t("of")} ${mb(u.maxBytes)} MB · ${u.files} ${t("of")} ${u.maxFiles} ${t("files")}`;
  m.append(el("div",{class:"bar"},i));m.classList.remove("hide")}catch(e){m.classList.add("hide")}}
function renderLists(){
 SECS.forEach(([s])=>SUBS.forEach(b=>{
  const ul=$(`#l-${s}-${b}`),list=items.filter(i=>i.sec===s&&i.sub===b);
  ul.textContent="";
  $(`#c-${s}-${b}`).textContent=list.length?`(${list.length})`:"";
  if(!list.length)ul.append(el("li",{class:"empty"},t("empty")));
  list.forEach(i=>{
   const li=el("li",{class:"it"});
   li.append(el("span",{class:"tag"},i.tag||"FILE"),el("span",{class:"ttl"},i.title||""));
   const href=i.kind==="link"?i.url:"/_blob/"+i.assetId;
   if(i.kind==="link"){if(safeUrl(href))li.append(el("a",{href,target:"_blank",rel:"noopener noreferrer"},t("open")))}
   else{li.append(el("a",{href,download:i.name||"file"},t("download")));
    if((i.ct||"").startsWith("video/"))li.append(el("video",{controls:"",preload:"metadata",src:href}))}
   if(admin)li.append(el("button",{class:"btn ghost",onclick:()=>del(i)},t("del")));
   ul.append(li)});
  const f=$(`#f-${s}-${b}`);f.textContent="";if(admin)f.append(addForm(s,b));
 }));
}
function addForm(s,b){
 const title=el("input",{type:"text",placeholder:t("name")});
 const kind=el("select",{},el("option",{value:"file"},t("file")),el("option",{value:"link"},t("link")));
 const file=el("input",{type:"file"});const url=el("input",{type:"url",placeholder:t("url"),class:"hide"});
 const err=el("div",{class:"err"});const go=el("button",{class:"btn",type:"button"},t("save"));
 kind.onchange=()=>{file.classList.toggle("hide",kind.value!=="file");url.classList.toggle("hide",kind.value!=="link")};
 go.onclick=async()=>{err.textContent="";
  const isF=kind.value==="file",f=file.files[0],u=url.value.trim();
  if(!title.value.trim()||(isF?!f:!safeUrl(u))){err.textContent=t("need");return}
  go.disabled=true;go.textContent=t("saving");
  try{
   const rec={sec:s,sub:b,title:title.value.trim(),kind:kind.value,at:Date.now()};
   if(isF){const r=await assets.upload(f);rec.assetId=r.id;rec.ct=r.contentType||f.type;rec.name=f.name;
    const ext=(f.name.split(".").pop()||"").toUpperCase();rec.tag=rec.ct.startsWith("video/")?"VIDEO":ext==="PDF"?"PDF":ext.slice(0,5)||"FILE"}
   else{rec.url=u;rec.tag="LINK"}
   await db.collection("materials").add(rec);title.value="";file.value="";url.value="";meter();
  }catch(e){err.textContent=e&&e.code==="unsupported_type"?t("unsupported"):t("fail")}
  go.disabled=false;go.textContent=t("save")};
 return el("div",{class:"add"},el("strong",{},t("add")),title,kind,file,url,err,go);
}
async function del(i){
 if(!confirm(t("confirm")))return;
 try{await db.collection("materials").doc(i.id).delete();if(i.assetId&&assets)await assets.delete(i.assetId).catch(()=>{});meter()}catch(e){note(t("fail"))}
}

$$(".sw button").forEach(b=>b.onclick=()=>setLang(b.dataset.l));

async function tryEnter(){
 if(await sha($("#code").value.trim())===H_CODE){try{sessionStorage.setItem("ok","1")}catch(e){}showApp()}
 else $("#gerr").textContent=t("bad");
}
function showApp(){$("#gate").classList.add("hide");$("#app").classList.remove("hide");applyText()}
$("#enter").onclick=tryEnter;$("#code").onkeydown=e=>{if(e.key==="Enter")tryEnter()};

$("#admBtn").onclick=()=>{if(admin){admin=false;applyText();return}$("#pw").value="";$("#perr").textContent="";$("#dlg").showModal()};
$("#pcancel").onclick=()=>$("#dlg").close();
async function tryAdmin(){
 if(await sha($("#pw").value)!==H_ADM){$("#perr").textContent=t("badPw");return}
 const ok=db&&assets&&user&&await user.canEdit();
 if(!ok){$("#perr").textContent=t("noEdit");return}
 admin=true;$("#dlg").close();applyText();
}
$("#pok").onclick=tryAdmin;$("#pw").onkeydown=e=>{if(e.key==="Enter")tryAdmin()};

buildSecs();applyText();
try{if(sessionStorage.getItem("ok")==="1")showApp()}catch(e){}
(async()=>{
 if(!window.claude){note(t("noDb"));return}
 db=await claude.use("db");assets=await claude.use("assets");user=await claude.use("user");
 if(!db){note(t("noDb"));return}
 db.collection("materials").onSnapshot(s=>{
  items=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.at||0)-(b.at||0));note("");renderLists()},
  ()=>note(t("noDb")));
})();
</script>
</body>
</html>
