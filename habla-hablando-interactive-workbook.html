<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Habla hablando · Spanish Conversation for Beginners · Workbook</title>
<style>
:root{--paper:#F7F1E6;--ink:#231A17;--muted:#6A5D53;--line:#D9CDB8;--wine:#6B1E1E;--green:#1F6B3A;--blue:#136F9B;--rose:#F6E4E1;
--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.5 var(--sans)}
.wrap{max-width:780px;margin:0 auto;padding:0 18px}
#stage{padding-bottom:150px;min-height:100vh}
.uh{display:flex;gap:16px;align-items:center;padding:20px 22px;color:#fff;border-bottom:4px solid #C9A24B;background:repeating-linear-gradient(0deg,#ffffff14 0 10px,transparent 10px 22px),repeating-linear-gradient(90deg,#00000022 0 10px,transparent 10px 22px),var(--wine)}
.uh>div:last-child{max-width:700px}
.un{font:700 3.4rem/1 var(--serif);opacity:.55}
.kick{font:600 .75rem var(--sans);letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.ut{font:700 clamp(1.6rem,6vw,2.4rem)/1.1 var(--serif)}
.us{font-style:italic;opacity:.9}
h1{font:700 clamp(2rem,7vw,3rem)/1.1 var(--serif);color:var(--wine);margin:26px 0 6px}
h2{font:700 1.5rem/1.2 var(--serif);color:var(--wine);margin:26px 0 4px}
h3{font:700 1.15rem var(--serif);color:var(--blue);margin:22px 0 6px}
.hint{color:var(--muted);margin:0 0 14px;font-size:.95rem}
.note{background:#fff;border-left:4px solid var(--blue);padding:10px 14px;margin:18px 0 0;font-size:.95rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#fff;border:1px solid var(--line);border-top:3px solid var(--wine);border-radius:6px;padding:12px 14px}
.card .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card b{font:700 1.3rem var(--serif)}
.en{color:var(--wine);font-style:italic;font-size:.9rem}
.ipa{color:var(--muted);font-size:.9rem}
.ex{margin:8px 0 0;padding-top:8px;border-top:1px solid var(--line);font-style:italic}
button{font:600 .9rem var(--sans);cursor:pointer;border-radius:6px;border:1px solid var(--green);background:#fff;color:var(--green);padding:6px 12px}
button:hover{background:var(--green);color:#fff}
button.big{background:var(--green);color:#fff;padding:9px 16px}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.row{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
.line{display:flex;gap:12px;align-items:center;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:6px;margin-bottom:8px}
.line.a{border-left:5px solid var(--wine)}.line.b{border-left:5px solid var(--blue);margin-left:22px}
.who{flex:0 0 5.6rem;font-size:.8rem;color:var(--muted);font-weight:600}
.line .t{flex:1;font-size:1.05rem}.line.on{background:#FFF4C9}
.ph{background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.ph b{font-family:var(--serif);font-size:1.15rem}
.tip{background:var(--rose);border-radius:6px;padding:12px 14px;margin-top:16px}
.rp{background:#fff;border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:6px;padding:12px 14px}
.rp ol{margin:6px 0 0;padding-left:1.3rem}
.q{background:#fff;border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:12px}
.q p{margin:0 0 8px;font-weight:600}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opts button{border-color:var(--line);color:var(--ink)}
.opts button:hover{background:var(--rose);color:var(--ink)}
.opts button.ok{background:var(--green);color:#fff;border-color:var(--green)}
.opts button.no{background:#B3261E;color:#fff;border-color:#B3261E}
.fb{margin-top:8px;font-size:.95rem;min-height:1.3em}
.score{font:700 1.2rem var(--serif);color:var(--wine)}
textarea{width:100%;min-height:100px;border:1px solid var(--line);border-radius:6px;padding:10px;font:inherit;background:#fff}
label.chk{display:flex;gap:10px;align-items:center;margin:6px 0}
label.chk input{width:20px;height:20px}
.cover{display:flex;flex-direction:column;align-items:center;padding:18px 14px 0}
.cover img{max-width:100%;max-height:calc(100vh - 190px);box-shadow:0 6px 24px #0003;border:1px solid var(--line)}
.p p{font-size:1.05rem;margin:0 0 14px}
.p .kk{font:600 .8rem var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--blue);margin-top:22px}
.p .sig b{font:700 1.5rem var(--serif);color:var(--wine);display:block}
.p .sig span{font:600 .75rem var(--sans);letter-spacing:.14em;color:var(--muted)}
.ixgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button.ix{display:flex;gap:10px;text-align:left;align-items:baseline;background:#fff;border-color:var(--line);color:var(--ink);padding:8px 10px;font-weight:500}
button.ix:hover{background:var(--rose);color:var(--ink)}
button.ix .n{font:700 1.1rem var(--serif);color:var(--wine);flex:0 0 1.6rem}
button.ix em{color:var(--muted);font-size:.82rem}
.back{background:repeating-linear-gradient(90deg,#1F6B3A 0 34px,#27794A 34px 68px);color:#fff;min-height:calc(100vh - 140px);padding:40px 22px;text-align:center}
.back h1{color:#fff;letter-spacing:.2em;font-size:clamp(1.6rem,6vw,2.4rem)}
.back .box{background:var(--paper);color:var(--ink);max-width:560px;margin:24px auto;padding:22px;border-radius:6px;text-align:left}
.back ul{margin:8px 0 0;padding-left:1.2rem}.back h2{margin-top:0}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.nav .in{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:12px}
.nav .arrow{flex:0 0 52px;height:52px;border-radius:50%;padding:0;background:var(--wine);border-color:var(--wine);color:#fff;display:grid;place-items:center}
.nav .arrow:hover{background:#4d1515}.nav .arrow:disabled{opacity:.3;cursor:default;background:var(--wine)}
.nav svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.mid{flex:1;text-align:center;line-height:1.25;min-width:0}
.mid b{font:700 1rem var(--serif);color:var(--wine);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid small{color:var(--muted)}
.dots{display:flex;gap:6px;justify-content:center;margin:3px 0}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--wine)}
.tools button{font-size:.78rem;padding:2px 9px;margin:0 3px;border-color:var(--line);color:var(--muted)}
.tools button:hover{background:var(--rose);color:var(--ink)}
@media(max-width:600px){.grid,.ixgrid{grid-template-columns:1fr}.line.b{margin-left:0}.who{flex-basis:4.2rem}.un{font-size:2.6rem}}
#stage{position:relative}.logo{position:absolute;top:12px;right:14px;width:84px;height:auto;z-index:3;pointer-events:none}.uh{padding-right:110px}
.uh .kick{color:#E8C873}
.tin{flex:1;min-width:180px;border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:inherit;background:#fff}
.fb.g{color:var(--green);font-weight:600}.fb.m{color:#8A6100;font-weight:600}.fb.l{color:#B3261E;font-weight:600}
.built,.bank{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;min-height:42px;padding:6px;border-radius:6px}
.built{background:var(--rose);border:1px dashed var(--wine)}.bank button{border-color:var(--line);color:var(--ink)}.built button{background:#fff;color:var(--wine);border-color:var(--wine)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:3px 11px;font-size:.9rem;color:var(--muted)}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
input[type=range]{accent-color:var(--wine)}
</style>
</head>

 pasos"], "warm": [["¿Cuál es tu número de teléfono?", "What is your phone number?"], ["¿Puedes contar del uno al diez?", "Can you count from one to ten?"]], "words": [["cero", "/ˈseɾo/", "zero", "Tengo cero (0) hermanos."], ["cinco", "/ˈsinko/", "five", "Tengo cinco (5) libros."], ["diez", "/djes/", "ten", "Hay diez (10) estudiantes."], ["veinte", "/ˈbejnte/", "twenty", "Ella tiene veinte (20) años."], ["cincuenta", "/sinˈkwenta/", "fifty", "Cuesta cincuenta (50) pesos."], ["cien", "/sjen/", "one hundred", "Hay cien (100) personas aquí."], ["número de teléfono", "/ˈnumeɾo de teˈlefono/", "phone number", "¿Cuál es tu número de teléfono?"], ["llamo", "/ˈʝamo/", "I call", "Te llamo esta noche."]], "dialogue": [["Samuel", "Disculpa, ¿cuál es tu número de teléfono?"], ["Mía", "Es el 555-0142. Cinco, cinco, cinco, cero, uno, cuatro, dos."], ["Samuel", "Perdón, ¿puedes repetirlo, por favor?"], ["Mía", "¡Claro! Cinco, cinco, cinco, cero, uno, cuatro, dos."], ["Samuel", "¡Listo! ¿Tu casa es el número veinte?"], ["Mía", "No, es el veintidós. Calle del Parque, veintidós."], ["Samuel", "Calle del Parque, veintidós. ¡Perfecto!"], ["Mía", "¡Llámame a las siete! ¡Chao!"]], "phrases": [["¿Cuál es tu número de teléfono?", "What is your phone number?"], ["Mi número es ...", "My number is ..."], ["¿Puedes repetirlo?", "Can you say it again?"], ["¿Puedes repetir eso, por favor?", "Can you repeat that, please?"], ["¿Es el trece o el treinta?", "Is it 13 or 30?"], ["Perdón, no entiendo.", "Sorry, I don’t understand."]], "tip": "Phone numbers are often said in pairs or groups: ‘cincuenta y cinco, cero uno…’. Practise 13 (trece) and 30 (treinta): listen to the end of the word!", "roleplay": [{"who": "Samuel", "scenario": "You want your new friend’s phone number.", "steps": ["Ask: ‘¿Cuál es tu número de teléfono?’", "Repeat the number to check it.", "Say: ‘¡Te llamo esta noche!’"]}, {"who": "Mía", "scenario": "You give your phone number.", "steps": ["Say your number slowly.", "Repeat it if A asks.", "Say goodbye: ‘¡Chao!’"]}]}, {"n": 5, "title": "Familia y amigos", "sub": "Family & Friends", "part": [1, "Primeros pasos"], "warm": [["¿Cuántas personas hay en tu familia?", "How many people are in your family?"], ["¿Quién es tu mejor amigo?", "Who is your best friend?"]], "words": [["madre", "/ˈmadɾe/", "mother", "Mi madre (mamá) prepara el desayuno."], ["padre", "/ˈpadɾe/", "father", "Mi padre juega al fútbol."], ["hermana", "/eɾˈmana/", "sister", "Tengo una hermana, pero no tengo hermano."], ["hermano", "/eɾˈmano/", "brother", "Mi hermano tiene diez años."], ["abuela", "/aˈbwela/", "grandmother", "Mi abuela es la madre de mi mamá."], ["amigo", "/aˈmigo/", "friend", "Tomás es mi mejor amigo."], ["familia", "/faˈmilja/", "family", "Tengo una familia grande."], ["esposa", "/esˈposa/", "wife", "Su esposa es doctora."]], "dialogue": [["Mía", "¡Leo, mira esta foto!"], ["Leo", "¡Qué bien! ¿Quién es?"], ["Mía", "Es mi familia. Esta es mi madre."], ["Leo", "¡Qué guapa! ¿Esta es tu hermana?"], ["Mía", "Sí. Se llama Julia."], ["Leo", "¿Y quién es el señor que está a su lado?"], ["Mía", "Es mi padre. Es médico."], ["Leo", "¡Tu familia es genial, Mía!"]], "phrases": [["Esta es mi ...", "This is my ..."], ["Tengo dos hermanos.", "I have two brothers."], ["No tengo hermanas.", "I don’t have any sisters."], ["Ella es mi mejor amiga.", "She is my best friend."], ["¿Cuántos hermanos tienes?", "How many brothers and sisters do you have?"], ["¿Tienes una familia grande?", "Do you have a big family?"]], "tip": "Possessives agree with the noun, not the owner: ‘mi hermano / mis hermanos’. Say ‘mamá’ and ‘papá’ for ‘mum’ and ‘dad’.", "roleplay": [{"who": "Mía", "scenario": "You show a family photo.", "steps": ["Say: ‘Esta es mi familia.’", "Introduce three people.", "Say one thing about each person."]}, {"who": "Leo", "scenario": "You look at the photo.", "steps": ["Ask: ‘¿Quién es?’", "Ask: ‘¿Tienes hermanos?’", "Say something nice."]}]}, {"n": 6, "title": "Palabras de cortesía", "sub": "Polite Words: Please, Thank You & Sorry", "part": [1, "Primeros pasos"], "warm": [["¿Qué dices cuando recibes un regalo?", "What do you say when you get a gift?"], ["¿Qué dices cuando pisas a alguien?", "What do you say when you step on someone’s foot?"]], "words": [["por favor", "/poɾ faˈboɾ/", "please", "Un vaso de agua, por favor."], ["gracias", "/ˈgɾasjas/", "thank you", "¡Muchas gracias!"], ["perdón", "/peɾˈdon/", "sorry / pardon me", "Piso tu pie. Digo perdón."], ["disculpe", "/disˈkulpe/", "excuse me", "Disculpe, ¿dónde está el banco?"], ["de nada", "/de ˈnada/", "you're welcome", "Alguien dice gracias. Yo digo de nada."], ["no hay problema", "/no aj pɾoˈblema/", "no problem", "No hay problema, está bien."], ["cómo", "/ˈkomo/", "pardon? / what?", "No te oigo. Digo: ¿cómo?"], ["ayuda", "/aˈʝuda/", "help", "Necesito ayuda, por favor."]], "dialogue": [["Tomás", "Disculpe, ¿puedo sentarme aquí?"], ["Ana", "Sí, claro. Por favor, siéntese."], ["Tomás", "¡Gracias! Ay, perdón, golpeé su bolso."], ["Ana", "No hay problema. No pasa nada."], ["Tomás", "¿Me pasa el menú, por favor?"], ["Ana", "Aquí tiene."], ["Tomás", "¡Muchas gracias!"], ["Ana", "¡De nada!"]], "phrases": [["Disculpe, ...", "Excuse me, ..."], ["¿Puede ayudarme, por favor?", "Can you help me, please?"], ["¡Muchas gracias!", "Thank you very much!"], ["De nada.", "You’re welcome."], ["¡Perdón!", "Sorry!"], ["¿Cómo? ¿Puede repetir?", "Pardon? Can you repeat?"]], "tip": "Spanish has formal usted (‘disculpe’, ‘siéntese’) and informal tú (‘disculpa’, ‘siéntate’). Use usted with strangers and older people.", "roleplay": [{"who": "Tomás", "scenario": "You sit down in a busy café.", "steps": ["Say ‘Disculpe’ to ask for a seat.", "Say ‘¡Perdón!’ for a small mistake.", "Say ‘¡Muchas gracias!’"]}, {"who": "Ana", "scenario": "You are at the next table.", "steps": ["Say ‘Sí, claro. Siéntese.’", "Say ‘No hay problema.’", "Say ‘¡De nada!’"]}]}, {"n": 7, "title": "La rutina diaria", "sub": "Daily Routine", "part": [2, "Vida diaria"], "warm": [["¿A qué hora te despiertas?", "What time do you wake up?"], ["¿Qué haces después del trabajo o de la escuela?", "What do you do after work or school?"]], "words": [["me despierto", "/me desˈpjeɾto/", "I wake up", "Todas las mañanas me despierto a las siete."], ["desayuno", "/desaˈʝuno/", "I have breakfast", "Desayuno pan con leche."], ["voy al trabajo", "/boj al tɾaˈbaxo/", "I go to work", "Tomo el autobús y voy al trabajo."], ["almuerzo", "/alˈmweɾso/", "I have lunch", "Almuerzo al mediodía."], ["vuelvo a casa", "/ˈbwelbo a ˈkasa/", "I go back home", "Después del trabajo vuelvo a casa a las seis."], ["ceno", "/ˈseno/", "I have dinner", "Ceno con mi familia."], ["veo la tele", "/ˈbeo la ˈtele/", "I watch TV", "Después de cenar veo la tele."], ["me acuesto", "/me aˈkwesto/", "I go to bed", "Me acuesto a las once."]], "dialogue": [["Samuel", "¿A qué hora te despiertas, Emma?"], ["Emma", "Me despierto a las seis y media. ¡Es temprano!"], ["Samuel", "¡Uf! ¿Desayunas en casa?"], ["Emma", "Sí. Después voy al trabajo en autobús."], ["Samuel", "Yo empiezo a las nueve. Almuerzo a la una."], ["Emma", "Yo vuelvo a casa a las cinco y ceno."], ["Samuel", "Después de cenar veo la tele."], ["Emma", "Y yo me acuesto a las diez. ¡Buenas noches!"]], "phrases": [["Me despierto a las ...", "I wake up at ..."], ["Desayuno a las ...", "I have breakfast at ..."], ["Voy al trabajo en autobús.", "I go to work by bus."], ["¿A qué hora te levantas?", "What time do you get up?"], ["¿Qué haces después del trabajo?", "What do you do after work?"], ["Me acuesto a las ...", "I go to bed at ..."]], "tip": "Reflexive verbs use me, te, se: ‘me despierto’ (I wake up), ‘te levantas’ (you get up), ‘se acuesta’ (he/she goes to bed).", "roleplay": [{"who": "Samuel", "scenario": "You ask about a daily routine.", "steps": ["Ask: ‘¿A qué hora te despiertas?’", "Ask: ‘¿Qué haces después del trabajo?’", "Say your own routine."]}, {"who": "Emma", "scenario": "You tell about your day.", "steps": ["Say when you wake up.", "Say when you go to work and come home.", "Ask about A’s day."]}]}, {"n": 8, "title": "La hora", "sub": "Telling the Time", "part": [2, "Vida diaria"], "warm": [["¿Qué hora es ahora?", "What time is it now?"], ["¿A qué hora empieza tu clase?", "What time does your class start?"]], "words": [["en punto", "/en ˈpunto/", "o'clock", "Son las tres en punto (3:00)."], ["y media", "/i ˈmedja/", "half past", "Son las cuatro y media (4:30)."], ["y cuarto", "/i ˈkwaɾto/", "quarter past", "Son las seis y cuarto (6:15)."], ["menos cuarto", "/ˈmenos ˈkwaɾto/", "quarter to", "Son las ocho menos cuarto (7:45)."], ["mediodía", "/medjoˈdia/", "noon", "Almorzamos al mediodía (12 p.m.)."], ["medianoche", "/medjaˈnotʃe/", "midnight", "La fiesta termina a la medianoche (12 a.m.)."], ["temprano", "/temˈpɾano/", "early", "Me levanto temprano."], ["tarde", "/ˈtaɾde/", "late", "¡Perdón, llego tarde!"]], "dialogue": [["Tomás", "Disculpa, ¿qué hora es?"], ["Mía", "Son las cuatro y cuarto."], ["Tomás", "¡Ay no! La película empieza a las cuatro y media."], ["Mía", "Tranquilo. Tenemos quince minutos."], ["Tomás", "¿A qué hora termina la película?"], ["Mía", "Termina a las siete menos cuarto."], ["Tomás", "¡Perfecto! ¿Cenamos a las siete?"], ["Mía", "¡Genial! Nos vemos a las siete."]], "phrases": [["¿Qué hora es?", "What time is it?"], ["Son las nueve y diez.", "It’s ten past nine."], ["¿A qué hora empieza?", "What time does it start?"], ["Empieza a las ...", "It starts at ..."], ["Llego temprano. / Llego tarde.", "I’m early. / I’m late."], ["¿Este reloj está bien?", "Is this clock right?"]], "tip": "Use ‘Es la una’ for 1:00 (singular) but ‘Son las dos, las tres…’ for the rest. Add ‘de la mañana / de la tarde / de la noche’ for a.m. and p.m.", "roleplay": [{"who": "Tomás", "scenario": "You need to know the time.", "steps": ["Ask: ‘¿Qué hora es?’", "Ask: ‘¿A qué hora empieza la película?’", "Say: ‘¡Gracias!’"]}, {"who": "Mía", "scenario": "You help A.", "steps": ["Say the time.", "Say when the film starts and finishes.", "Say ‘¡Nos vemos a las ...!’"]}]}, {"n": 9, "title": "Días, fechas y cumpleaños", "sub": "Days, Dates & Birthdays", "part": [2, "Vida diaria"], "warm": [["¿Qué día es hoy?", "What day is it today?"], ["¿Cuándo es tu cumpleaños?", "When is your birthday?"]], "words": [["lunes", "/ˈlunes/", "Monday", "Trabajo los lunes."], ["fin de semana", "/fin de seˈmana/", "weekend", "El sábado y el domingo son el fin de semana."], ["hoy", "/oj/", "today", "Hoy es viernes."], ["mañana", "/maˈɲana/", "tomorrow", "Mañana es sábado."], ["mes", "/mes/", "month", "Julio es un mes de verano."], ["cumpleaños", "/kumpleˈaɲos/", "birthday", "Mi cumpleaños es en mayo."], ["fecha", "/ˈfetʃa/", "date", "¿Cuál es la fecha? Es el cinco de mayo."], ["año", "/ˈaɲo/", "year", "Un año tiene doce meses."]], "dialogue": [["Ana", "Samuel, ¿qué día es hoy?"], ["Samuel", "¡Es viernes! Mañana empieza el fin de semana."], ["Ana", "¡Sí! ¿Cuál es la fecha de hoy?"], ["Samuel", "Es el doce de junio."], ["Ana", "¡Mi cumpleaños es la próxima semana!"], ["Samuel", "¿De verdad? ¿Cuándo es?"], ["Ana", "Es el diecinueve de junio."], ["Samuel", "¡Genial! ¡Vamos a hacer una fiesta!"]], "phrases": [["¿Qué día es hoy?", "What day is it today?"], ["¿Cuál es la fecha de hoy?", "What is today’s date?"], ["¿Cuándo es tu cumpleaños?", "When is your birthday?"], ["Mi cumpleaños es el ...", "My birthday is on ..."], ["¡Feliz cumpleaños!", "Happy birthday!"], ["¡Nos vemos el lunes!", "See you on Monday!"]], "tip": "Spanish days and months are not capitalised: lunes, martes, enero, febrero. Dates use ‘el’ + number + ‘de’ + month: el doce de junio.", "roleplay": [{"who": "Ana", "scenario": "You plan a party.", "steps": ["Ask: ‘¿Qué día es hoy?’", "Ask: ‘¿Cuál es la fecha?’", "Say when your birthday is."]}, {"who": "Samuel", "scenario": "You are A’s friend.", "steps": ["Say the day and date.", "Ask: ‘¿Cuándo es tu cumpleaños?’", "Say ‘¡Feliz cumpleaños!’"]}]}, {"n": 10, "title": "El clima", "sub": "Talking About the Weather", "part": [2, "Vida diaria"], "warm": [["¿Cómo está el clima hoy?", "What’s the weather like today?"], ["¿Cuál es tu estación favorita?", "What’s your favourite season?"]], "words": [["soleado", "/soleˈado/", "sunny", "Hay sol. Está soleado."], ["lluvioso", "/ʝuˈbjoso/", "rainy", "Necesito paraguas. Está lluvioso."], ["nublado", "/nuˈblado/", "cloudy", "No hay sol. El cielo está nublado."], ["ventoso", "/benˈtoso/", "windy", "Mi sombrero vuela. Está ventoso."], ["nieve", "/ˈnjebe/", "snow", "¡Mira! Está cayendo nieve."], ["calor", "/kaˈloɾ/", "heat (hot)", "Hay 35 grados. ¡Hace calor!"], ["frío", "/ˈfɾio/", "cold", "Hay 0 grados. ¡Hace frío!"], ["paraguas", "/paˈɾagwas/", "umbrella", "Lleva un paraguas por la lluvia."]], "dialogue": [["Leo", "¡Buenos días, Emma! ¿Cómo está el clima?"], ["Emma", "Está nublado y hace un poco de viento."], ["Leo", "¿Hace frío hoy?"], ["Emma", "Sí, hace frío. ¡Lleva una chaqueta!"], ["Leo", "¡Mira! Ahora está lloviendo."], ["Emma", "¡Ay no! ¿Dónde está mi paraguas?"], ["Leo", "Tranquila. Mañana va a estar soleado."], ["Emma", "¡Qué bien! Vamos al parque mañana."]], "phrases": [["¿Cómo está el clima?", "What’s the weather like?"], ["Está soleado. / Está lluvioso.", "It’s sunny. / It’s rainy."], ["Está lloviendo.", "It’s raining."], ["¡Hoy hace calor!", "It’s hot today!"], ["¿Cuál es la temperatura?", "What’s the temperature?"], ["¿Te gusta el invierno?", "Do you like winter?"]], "tip": "For weather use ‘hace’ + noun (hace frío, hace calor, hace sol, hace viento) and ‘está’ + adjective (está nublado, está lloviendo).", "roleplay": [{"who": "Leo", "scenario": "You phone a friend in another city.", "steps": ["Ask: ‘¿Cómo está el clima?’", "Ask: ‘¿Hace frío?’", "Say what the weather is like where you are."]}, {"who": "Emma", "scenario": "You answer from your city.", "steps": ["Say it is sunny, rainy or cloudy.", "Say if it is hot or cold.", "Ask about A’s weather."]}]}, {"n": 11, "title": "Pasatiempos", "sub": "Hobbies & Free Time", "part": [2, "Vida diaria"], "warm": [["¿Qué haces en tu tiempo libre?", "What do you do in your free time?"], ["¿Te gustan los deportes o la música?", "Do you like sports or music?"]], "words": [["pasatiempo", "/pasaˈtjempo/", "hobby", "Mi pasatiempo es la fotografía."], ["música", "/ˈmusika/", "music", "Escucho música todos los días."], ["fútbol", "/ˈfutbol/", "football", "Jugamos al fútbol los domingos."], ["leer", "/leˈeɾ/", "to read", "Me gusta leer libros antes de dormir."], ["nadar", "/naˈdaɾ/", "to swim", "A ella le gusta nadar en el mar."], ["cocinar", "/kosiˈnaɾ/", "to cook", "A mi papá le gusta cocinar pasta."], ["bailar", "/bajˈlaɾ/", "to dance", "Me encanta bailar en las fiestas."], ["película", "/peˈlikula/", "film", "Vamos a ver una película esta noche."]], "dialogue": [["Samuel", "¿Qué haces en tu tiempo libre, Mía?"], ["Mía", "Me encanta la música. Toco la guitarra."], ["Samuel", "¡Qué bien! A mí me gusta el fútbol. Juego los sábados."], ["Mía", "¿Te gustan las películas?"], ["Samuel", "¡Sí! Veo películas los domingos."], ["Mía", "¡Yo también! ¿Te gusta cocinar?"], ["Samuel", "No mucho. ¡Pero me encanta bailar!"], ["Mía", "¡Vamos a bailar este fin de semana!"]], "phrases": [["¿Cuál es tu pasatiempo?", "What’s your hobby?"], ["Me gusta ... / Me encanta ...", "I like ... / I love ..."], ["No me gusta ...", "I don’t like ..."], ["¿Te gusta la música?", "Do you like music?"], ["Juego al fútbol.", "I play football."], ["¡Hagamos algo divertido!", "Let’s do something fun!"]], "tip": "‘Me gusta’ is followed by a verb (me gusta bailar) or a singular noun (me gusta la música). For plurals use ‘me gustan’ (me gustan las películas).", "roleplay": [{"who": "Samuel", "scenario": "You meet someone new at a party.", "steps": ["Ask: ‘¿Qué haces en tu tiempo libre?’", "Say what you like: ‘Me gusta ...’", "Invite B to do something together."]}, {"who": "Mía", "scenario": "You love your hobbies.", "steps": ["Say two hobbies.", "Ask: ‘¿Y tú?’", "Accept: ‘¡Sí, me encantaría!’"]}]}, {"n": 12, "title": "En casa", "sub": "At Home", "part": [2, "Vida diaria"], "warm": [["¿Cuántas habitaciones tiene tu casa?", "How many rooms does your home have?"], ["¿Cuál es tu habitación favorita?", "What’s your favourite room?"]], "words": [["cocina", "/koˈsina/", "kitchen", "Cocino en la cocina."], ["dormitorio", "/doɾmiˈtoɾjo/", "bedroom", "Duermo en mi dormitorio."], ["baño", "/ˈbaɲo/", "bathroom", "Ella se ducha en el baño."], ["sala", "/ˈsala/", "living room", "Vemos la tele en la sala."], ["jardín", "/xaɾˈdin/", "garden", "El jardín tiene muchas flores."], ["puerta", "/ˈpweɾta/", "door", "Por favor, cierra la puerta."], ["ventana", "/benˈtana/", "window", "Abre la ventana, por favor."], ["mesa", "/ˈmesa/", "table", "La comida está en la mesa."]], "dialogue": [["Ana", "¡Bienvenido a mi nuevo departamento, Tomás!"], ["Tomás", "¡Gracias! Es precioso. ¿Dónde está la cocina?"], ["Ana", "Está aquí. Tenemos una mesa grande."], ["Tomás", "¡Qué bien! ¿Y dónde está el dormitorio?"], ["Ana", "Al lado del baño. ¡Ven a verlo!"], ["Tomás", "¡Guau! ¡Qué ventana tan grande!"], ["Ana", "Ahora vamos a la sala."], ["Tomás", "¡Me encanta tu casa, Ana!"]], "phrases": [["¡Bienvenido a mi casa!", "Welcome to my home!"], ["Esta es la cocina.", "This is the kitchen."], ["¿Dónde está el baño, por favor?", "Where is the bathroom, please?"], ["¿Puedo abrir la ventana?", "Can I open the window?"], ["Hay un/una ... en la habitación.", "There is a ... in the room."], ["Estás en tu casa.", "Make yourself at home."]], "tip": "‘Hay’ means ‘there is / there are’ and never changes: ‘hay una mesa, hay dos sillas’. Use ‘está’ to say where something is: ‘la mesa está aquí’.", "roleplay": [{"who": "Ana", "scenario": "You show your new home.", "steps": ["Say: ‘¡Bienvenido a mi casa!’", "Show three rooms.", "Say one thing about each room."]}, {"who": "Tomás", "scenario": "You visit A’s home.", "steps": ["Say it is beautiful.", "Ask: ‘¿Dónde está el baño?’", "Say your favourite room."]}]}, {"n": 13, "title": "En el restaurante", "sub": "At the Restaurant", "part": [3, "Comida y compras"], "warm": [["¿Te gusta comer en restaurantes?", "Do you like eating in restaurants?"], ["¿Cuál es tu comida favorita?", "What’s your favourite food?"]], "words": [["menú", "/meˈnu/", "menu", "¿Puedo ver el menú, por favor?"], ["camarero", "/kamaˈɾeɾo/", "waiter", "El camarero es muy amable."], ["mesa", "/ˈmesa/", "table", "Una mesa para dos, por favor."], ["pedir", "/peˈdiɾ/", "to order", "¿Están listos para pedir?"], ["pollo", "/ˈpoʝo/", "chicken", "Quisiera el pollo, por favor."], ["ensalada", "/ensaˈlada/", "salad", "Una ensalada verde, por favor."], ["postre", "/ˈpostɾe/", "dessert", "¿Desean un postre?"], ["cuenta", "/ˈkwenta/", "bill", "La cuenta, por favor."]], "dialogue": [["Emma (cliente)", "Buenas noches. Una mesa para dos, por favor."], ["Leo (camarero)", "Claro que sí. Aquí tiene el menú."], ["Emma (cliente)", "Gracias. Quisiera el pollo, por favor."], ["Leo (camarero)", "¿Desea algo de beber?"], ["Emma (cliente)", "Sí, un vaso de agua, por favor."], ["Leo (camarero)", "¿Algo más? Hoy tenemos un postre delicioso."], ["Emma (cliente)", "No, gracias. Solo la cuenta, por favor."], ["Leo (camarero)", "Aquí tiene. ¡Buenas noches!"]], "phrases": [["Una mesa para dos, por favor.", "A table for two, please."], ["¿Puedo ver el menú?", "Can I see the menu?"], ["Quisiera ..., por favor.", "I would like ..., please."], ["¿Qué me recomienda?", "What do you recommend?"], ["La cuenta, por favor.", "The bill, please."], ["¡Está delicioso!", "It’s delicious!"]], "tip": "‘Quisiera’ (I would like) is more polite than ‘quiero’ (I want). Say ‘Quisiera un café, por favor.’", "roleplay": [{"who": "Emma (cliente)", "scenario": "You are a customer.", "steps": ["Ask for a table for two.", "Order food and a drink.", "Ask for the bill: ‘La cuenta, por favor.’"]}, {"who": "Leo (camarero)", "scenario": "You are the waiter.", "steps": ["Say ‘Buenas noches. Aquí tiene el menú.’", "Ask: ‘¿Desea algo de beber?’", "Bring the bill and say thanks."]}]}, {"n": 14, "title": "En la cafetería", "sub": "At the Café", "part": [3, "Comida y compras"], "warm": [["¿Prefieres café o té?", "Do you prefer coffee or tea?"], ["¿Qué desayunas?", "What do you have for breakfast?"]], "words": [["café", "/kaˈfe/", "coffee", "Quisiera un café, por favor."], ["té", "/te/", "tea", "Un té con limón, por favor."], ["leche", "/ˈletʃe/", "milk", "¿Quieres leche?"], ["azúcar", "/aˈsukaɾ/", "sugar", "Sin azúcar, gracias."], ["sándwich", "/ˈsandwitʃ/", "sandwich", "Un sándwich de queso, por favor."], ["pastel", "/pasˈtel/", "cake", "Este pastel de chocolate está riquísimo."], ["pequeño", "/peˈkeɲo/", "small", "Un café pequeño, por favor."], ["para llevar", "/paɾa ʝeˈbaɾ/", "to take away", "Un café para llevar, por favor."]], "dialogue": [["Mía (cliente)", "¡Hola! Un café con leche, por favor."], ["Samuel (barista)", "Claro. ¿Pequeño, mediano o grande?"], ["Mía (cliente)", "Mediano, por favor. Y un pastel de chocolate."], ["Samuel (barista)", "¿Algo más?"], ["Mía (cliente)", "No, gracias. ¿Cuánto es?"], ["Samuel (barista)", "Son sesenta pesos. ¿Aquí o para llevar?"], ["Mía (cliente)", "Para llevar, por favor. Tome cien pesos."], ["Samuel (barista)", "¡Gracias! Aquí tiene su cambio. ¡Que lo disfrute!"]], "phrases": [["Un café con leche, por favor.", "A coffee with milk, please."], ["¿Pequeño, mediano o grande?", "Small, medium or large?"], ["¿Aquí o para llevar?", "Eat in or take away?"], ["¿Cuánto es?", "How much is it?"], ["Aquí tiene su cambio.", "Here is your change."], ["¿Puedo pagar con tarjeta?", "Can I pay by card?"]], "tip": "In many Spanish-speaking countries a ‘café con leche’ is half coffee, half milk. A ‘cortado’ is espresso with a little milk.", "roleplay": [{"who": "Mía (cliente)", "scenario": "You are a customer in a café.", "steps": ["Order a drink and a snack.", "Say the size you want.", "Ask: ‘¿Cuánto es?’"]}, {"who": "Samuel (barista)", "scenario": "You are the barista.", "steps": ["Ask: ‘¿Pequeño, mediano o grande?’", "Ask: ‘¿Aquí o para llevar?’", "Say the price."]}]}, {"n": 15, "title": "En el supermercado", "sub": "At the Supermarket", "part": [3, "Comida y compras"], "warm": [["¿Dónde compras la comida?", "Where do you buy food?"], ["¿Qué necesitas comprar hoy?", "What do you need to buy today?"]], "words": [["pan", "/pan/", "bread", "Necesitamos pan y leche."], ["manzanas", "/manˈsanas/", "apples", "Quisiera un kilo de manzanas."], ["huevos", "/ˈwebos/", "eggs", "¿Tenemos huevos?"], ["arroz", "/aˈros/", "rice", "Cocino arroz con pollo."], ["queso", "/ˈkeso/", "cheese", "Me encanta la pizza con queso."], ["carrito", "/kaˈrito/", "trolley", "Empuja el carrito."], ["pasillo", "/paˈsiʝo/", "aisle", "Está en el pasillo cinco."], ["caja", "/ˈkaxa/", "checkout", "Pagamos en la caja."]], "dialogue": [["Tomás", "Hagamos una lista. Necesitamos pan y huevos."], ["Ana", "Y manzanas. Con un kilo es suficiente."], ["Tomás", "¿Dónde está el queso?"], ["Ana", "Está en el pasillo tres, junto a la leche."], ["Tomás", "¡Mira! ¡El arroz está en oferta!"], ["Ana", "¡Genial! Lleva dos bolsas."], ["Tomás", "Bueno. Ahora vamos a la caja."], ["Ana", "Buena idea. Tengo mi propia bolsa."]], "phrases": [["¿Dónde puedo encontrar ...?", "Where can I find ...?"], ["¿Cuánto cuesta esto?", "How much is this?"], ["Está en oferta.", "It’s on offer."], ["Un kilo de ..., por favor.", "A kilo of ..., please."], ["¿Tiene una bolsa?", "Do you have a bag?"], ["Solo estoy mirando.", "I’m just looking."]], "tip": "Spanish nouns have gender: el pan, la leche, los huevos, las manzanas. Learn each noun with its article (el / la).", "roleplay": [{"who": "Tomás", "scenario": "You have a shopping list.", "steps": ["Say what you need.", "Ask: ‘¿Dónde está el queso?’", "Ask: ‘¿Cuánto cuesta esto?’"]}, {"who": "Ana", "scenario": "You work in the supermarket.", "steps": ["Say the aisle for each thing.", "Say the prices.", "Ask: ‘¿Algo más?’"]}]}, {"n": 16, "title": "Comprar ropa", "sub": "Shopping for Clothes", "part": [3, "Comida y compras"], "warm": [["¿Qué ropa llevas hoy?", "What are you wearing today?"], ["¿Cuál es tu color favorito?", "What’s your favourite colour?"]], "words": [["camisa", "/kaˈmisa/", "shirt", "Me gusta esta camisa azul."], ["pantalones", "/pantaˈlones/", "trousers", "Estos pantalones son muy largos."], ["chaqueta", "/tʃaˈketa/", "jacket", "Hace frío. Lleva una chaqueta."], ["zapatos", "/saˈpatos/", "shoes", "¿Dónde están los zapatos?"], ["talla", "/ˈtaʝa/", "size", "¿Qué talla usa?"], ["probarme", "/pɾoˈbaɾme/", "to try on (myself)", "¿Puedo probarme este vestido?"], ["demasiado grande", "/demaˈsjado ˈgɾande/", "too big", "Este abrigo es demasiado grande."], ["color", "/koˈloɾ/", "colour", "¿Qué color te gusta?"]], "dialogue": [["Mía (clienta)", "Disculpe, ¿tiene esta camisa en azul?"], ["Leo (vendedor)", "Sí, claro. ¿Qué talla usa?"], ["Mía (clienta)", "Uso la mediana."], ["Leo (vendedor)", "Aquí tiene. El probador está allí."], ["Mía (clienta)", "Gracias. Mmm, es demasiado grande. ¿Tiene una pequeña?"], ["Leo (vendedor)", "Déjeme ver. ¡Sí! Aquí tiene una pequeña."], ["Mía (clienta)", "¡Me queda perfecta! ¿Cuánto cuesta?"], ["Leo (vendedor)", "Cuesta cuarenta pesos. ¿Quiere una bolsa?"]], "phrases": [["¿Tiene esto en una talla más grande?", "Do you have this in a bigger size?"], ["¿Puedo probármelo?", "Can I try it on?"], ["Es demasiado grande. / Es demasiado pequeño.", "It’s too big. / It’s too small."], ["Me queda perfecto.", "It fits perfectly."], ["Me lo llevo.", "I’ll take it."], ["¿Dónde está el probador?", "Where is the changing room?"]], "tip": "Adjectives agree with the noun and come after it: ‘la camisa roja’, ‘los zapatos rojos’. ‘Demasiado’ means ‘too (much)’.", "roleplay": [{"who": "Mía (clienta)", "scenario": "You want to buy clothes.", "steps": ["Ask for a shirt in your size.", "Say: ‘¿Puedo probármela?’", "Say if it is too big or too small."]}, {"who": "Leo (vendedor)", "scenario": "You are the shop assistant.", "steps": ["Ask: ‘¿Qué talla usa?’", "Show the changing room.", "Say the price and ask about a bag."]}]}, {"n": 17, "title": "Preguntar precios", "sub": "$9", "part": [3, "Comida y compras"], "warm": [["¿Te gusta ir de compras?", "Do you like shopping?"], ["¿Qué quieres comprar?", "What do you want to buy?"]], "words": [["precio", "/ˈpɾesjo/", "price", "¿Cuál es el precio?"], ["caro", "/ˈkaɾo/", "expensive", "¿Doscientos pesos? ¡Eso es caro!"], ["barato", "/baˈɾato/", "cheap", "¿Solo cinco pesos? ¡Eso es barato!"], ["descuento", "/desˈkwento/", "discount", "Hoy hay un descuento."], ["efectivo", "/efekˈtibo/", "cash", "¿Puedo pagar en efectivo?"], ["tarjeta", "/taɾˈxeta/", "card", "¿Puedo pagar con tarjeta?"], ["recibo", "/reˈsibo/", "receipt", "¿Me da un recibo, por favor?"], ["cambio", "/ˈkambjo/", "change", "Aquí tiene su cambio."]], "dialogue": [["Samuel (cliente)", "Disculpe, ¿cuánto cuesta este reloj?"], ["Ana (vendedora)", "Cuesta ochenta pesos."], ["Samuel (cliente)", "Mmm, es caro. ¿Hay descuento?"], ["Ana (vendedora)", "¡Sí! Hoy tiene veinte por ciento de descuento."], ["Samuel (cliente)", "¡Genial! Entonces son sesenta y cuatro pesos."], ["Ana (vendedora)", "Exacto. ¿Efectivo o tarjeta?"], ["Samuel (cliente)", "Tarjeta, por favor. ¿Me da el recibo?"], ["Ana (vendedora)", "Por supuesto. Aquí tiene. ¡Gracias!"]], "phrases": [["¿Cuánto cuesta esto?", "How much is this?"], ["¿Cuánto cuestan estos?", "How much are these?"], ["Es demasiado caro.", "It’s too expensive."], ["¿Hay algún descuento?", "Is there any discount?"], ["¿Puedo pagar con tarjeta?", "Can I pay by card?"], ["¿Me da un recibo?", "Can I have a receipt?"]], "tip": "Use ‘cuesta’ for one thing (¿Cuánto cuesta este sombrero?) and ‘cuestan’ for several (¿Cuánto cuestan estos zapatos?).", "roleplay": [{"who": "Samuel (cliente)", "scenario": "You want to buy a watch.", "steps": ["Ask: ‘¿Cuánto cuesta?’", "Say: ‘¡Es
