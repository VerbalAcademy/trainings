ente)", "scenario": "You phone a pizza place.", "steps": ["Say: ‘Quisiera pedir una pizza.’", "Choose the size and extras.", "Give your address."]}, {"who": "Mía (pizzería)", "scenario": "You take the order.", "steps": ["Ask: ‘¿Pequeña, mediana o grande?’", "Ask: ‘¿Cuál es su dirección?’", "Say how long it takes."]}]}, {"n": 19, "title": "Pedir direcciones", "sub": "Asking for Directions", "part": [4, "Cómo moverse"], "warm": [["¿Cómo vas a la escuela o al trabajo?", "How do you get to school or work?"], ["¿Tu casa está cerca de una estación?", "Is your home near a station?"]], "words": [["izquierda", "/isˈkjeɾda/", "left", "Gira a la izquierda en la esquina."], ["derecha", "/deˈɾetʃa/", "right", "Gira a la derecha en el banco."], ["derecho", "/deˈɾetʃo/", "straight on", "Sigue derecho dos cuadras."], ["esquina", "/esˈkina/", "corner", "La tienda está en la esquina."], ["al lado de", "/al ˈlado de/", "next to", "El banco está al lado de la oficina de correos."], ["enfrente de", "/enˈfɾente de/", "opposite", "El hotel está enfrente de la plaza."], ["lejos", "/ˈlexos/", "far", "¿Está lejos de aquí?"], ["mapa", "/ˈmapa/", "map", "¿Tienes un mapa?"]], "dialogue": [["Leo (turista)", "Disculpa, ¿dónde está la estación de tren?"], ["Ana (local)", "Sigue derecho dos cuadras."], ["Leo (turista)", "Dos cuadras. ¿Y después?"], ["Ana (local)", "Gira a la izquierda en el banco. Está en la esquina."], ["Leo (turista)", "¿Está lejos de aquí?"], ["Ana (local)", "No, está a cinco minutos a pie."], ["Leo (turista)", "¡Perfecto! ¿Está al lado del parque?"], ["Ana (local)", "Sí, está enfrente del parque. ¡Buena suerte!"]], "phrases": [["Disculpa, ¿dónde está ...?", "Excuse me, where is ...?"], ["¿Cómo llego a ...?", "How do I get to ...?"], ["Gira a la izquierda. / Gira a la derecha.", "Turn left. / Turn right."], ["Sigue derecho.", "Go straight on."], ["Está al lado de / enfrente de ...", "It’s next to / opposite ..."], ["¿Está lejos?", "Is it far?"]], "tip": "‘Dónde está’ asks about location. ‘Al lado de’ (next to), ‘enfrente de’ (opposite) and ‘entre’ (between) describe where things are. Remember: a + el = al, de + el = del.", "roleplay": [{"who": "Leo (turista)", "scenario": "You are a tourist and you are lost.", "steps": ["Ask: ‘¿Dónde está la estación?’", "Ask: ‘¿Está lejos?’", "Repeat the directions."]}, {"who": "Ana (local)", "scenario": "You are a local person.", "steps": ["Say ‘Sigue derecho...’", "Say ‘Gira a la izquierda / derecha’.", "Say what is next to it."]}]}, {"n": 20, "title": "En el autobús", "sub": "Taking the Bus", "part": [4, "Cómo moverse"], "warm": [["¿Tomas el autobús?", "Do you take the bus?"], ["¿Dónde está la parada más cercana?", "Where is the nearest stop?"]], "words": [["parada", "/paˈɾada/", "stop", "¿Dónde está la parada de autobús?"], ["boleto", "/boˈleto/", "ticket", "Un boleto, por favor."], ["conductor", "/kondukˈtoɾ/", "driver", "Pregunta al conductor."], ["número", "/ˈnumeɾo/", "number", "¿Qué número de autobús va al centro?"], ["centro", "/ˈsentɾo/", "city centre", "¿Este autobús va al centro?"], ["bajar", "/baˈxaɾ/", "to get off", "Quiero bajar aquí."], ["esperar", "/espeˈɾaɾ/", "to wait", "Voy a esperar el autobús."], ["próxima parada", "/ˈpɾoksima paˈɾada/", "next stop", "La próxima parada es la Plaza Mayor."]], "dialogue": [["Samuel (pasajero)", "Disculpe, ¿este autobús va al centro?"], ["Mía (conductora)", "Sí, va al centro. Suba, por favor."], ["Samuel (pasajero)", "Un boleto, por favor. ¿Cuánto cuesta?"], ["Mía (conductora)", "Dos pesos, por favor."], ["Samuel (pasajero)", "Aquí tiene. ¿Puede avisarme cuando lleguemos a la Plaza Mayor?"], ["Mía (conductora)", "Claro. Es la quinta parada."], ["Samuel (pasajero)", "Disculpe, ¿es esta la Plaza Mayor?"], ["Mía (conductora)", "¡Sí! Esta es la Plaza Mayor. ¡Que tenga un buen día!"]], "phrases": [["¿Este autobús va a ...?", "Does this bus go to ...?"], ["Un boleto a ..., por favor.", "One ticket to ..., please."], ["¿Cuánto cuesta el boleto?", "How much is the ticket?"], ["¿A qué hora sale el próximo autobús?", "What time is the next bus?"], ["¿Puede avisarme cuándo bajar?", "Can you tell me when to get off?"], ["¡Esta es mi parada!", "This is my stop!"]], "tip": "Use ‘subir’ (get on) and ‘bajar’ (get off) for buses, trains and planes: ‘subir al autobús’, ‘bajar del tren’.", "roleplay": [{"who": "Samuel (pasajero)", "scenario": "You are a passenger.", "steps": ["Ask: ‘¿Este autobús va a ...?’", "Buy one ticket.", "Ask the driver to tell you your stop."]}, {"who": "Mía (conductora)", "scenario": "You are the bus driver.", "steps": ["Say yes or no.", "Say the price.", "Tell A: ‘¡Esta es su parada!’"]}]}, {"n": 21, "title": "En taxi", "sub": "Taking a Taxi", "part": [4, "Cómo moverse"], "warm": [["¿Cuándo tomas un taxi?", "When do you take a taxi?"], ["¿Es caro el taxi en tu ciudad?", "Is a taxi expensive in your city?"]], "words": [["taxi", "/ˈtaksi/", "taxi", "Necesito un taxi para el aeropuerto."], ["conductor", "/kondukˈtoɾ/", "driver", "El conductor del taxi es amable."], ["aeropuerto", "/aeɾoˈpweɾto/", "airport", "Al aeropuerto, por favor."], ["dirección", "/diɾekˈsjon/", "address", "Dígame la dirección, por favor."], ["tráfico", "/ˈtɾafiko/", "traffic", "Hay mucho tráfico hoy."], ["cuánto tarda", "/ˈkwanto ˈtaɾda/", "how long does it take?", "¿Cuánto tarda en llegar?"], ["tarifa", "/taˈɾifa/", "fare", "¿Cuánto es la tarifa?"], ["maletero", "/maleˈteɾo/", "boot", "Ponga la maleta en el maletero."]], "dialogue": [["Emma (pasajera)", "¡Hola! Al aeropuerto, por favor."], ["Leo (conductor)", "Claro. Ponga la maleta en el maletero."], ["Emma (pasajera)", "Gracias. ¿Cuánto tarda en llegar?"], ["Leo (conductor)", "Unos treinta minutos. Hay mucho tráfico."], ["Emma (pasajera)", "¡Ay no! Mi vuelo es a las seis."], ["Leo (conductor)", "No se preocupe. Tenemos tiempo."], ["Emma (pasajera)", "¡Ya llegamos! ¿Cuánto es la tarifa?"], ["Leo (conductor)", "Son veinticinco pesos. ¡Buen viaje!"]], "phrases": [["¿Puede llevarme a ...?", "Can you take me to ...?"], ["Al aeropuerto, por favor.", "To the airport, please."], ["¿Cuánto tarda?", "How long does it take?"], ["Pare aquí, por favor.", "Please stop here."], ["¿Cuánto es la tarifa?", "How much is the fare?"], ["Quédese con el cambio.", "Keep the change."]], "tip": "‘Quédese con el cambio’ means ‘keep the change’: it is like a small tip. Usted forms (‘pare’, ‘quédese’) are polite with strangers.", "roleplay": [{"who": "Emma (pasajera)", "scenario": "You need a taxi.", "steps": ["Say where you want to go.", "Ask: ‘¿Cuánto tarda?’", "Ask: ‘¿Cuánto es la tarifa?’"]}, {"who": "Leo (conductor)", "scenario": "You are the taxi driver.", "steps": ["Ask: ‘¿A dónde va?’", "Say how long it takes.", "Say the fare."]}]}, {"n": 22, "title": "En el aeropuerto", "sub": "At the Airport", "part": [4, "Cómo moverse"], "warm": [["¿Te gustan los aeropuertos?", "Do you like airports?"], ["¿A dónde quieres viajar?", "Where do you want to travel?"]], "words": [["pasaporte", "/pasaˈpoɾte/", "passport", "Aquí está mi pasaporte."], ["boleto", "/boˈleto/", "ticket", "Tengo un boleto a Roma."], ["vuelo", "/ˈbwelo/", "flight", "Mi vuelo es a las seis."], ["puerta", "/ˈpweɾta/", "gate", "Vaya a la puerta doce."], ["maleta", "/maˈleta/", "suitcase", "Tengo una maleta."], ["tarjeta de embarque", "/taɾˈxeta de emˈbaɾke/", "boarding pass", "Aquí tiene su tarjeta de embarque."], ["seguridad", "/seguɾiˈdad/", "security", "Pase por el control de seguridad."], ["facturar", "/faktuˈɾaɾ/", "to check in (luggage)", "Quiero facturar mi maleta."]], "dialogue": [["Ana (viajera)", "Buenos días. Quisiera facturar, por favor."], ["Tomás (agente)", "Buenos días. Su pasaporte, por favor."], ["Ana (viajera)", "Aquí tiene."], ["Tomás (agente)", "¿Tiene equipaje para facturar?"], ["Ana (viajera)", "Sí, una maleta."], ["Tomás (agente)", "Aquí está su tarjeta de embarque. Su puerta es la B12."], ["Ana (viajera)", "Gracias. ¿A qué hora empieza el embarque?"], ["Tomás (agente)", "A las diez y cuarenta. ¡Buen viaje!"]], "phrases": [["Quisiera facturar.", "I would like to check in."], ["Aquí está mi pasaporte.", "Here is my passport."], ["Una maleta para facturar.", "One suitcase to check in."], ["¿Cuál es la puerta?", "Which gate is it?"], ["¿A qué hora embarcamos?", "What time do we board?"], ["¿Dónde está el control de seguridad?", "Where is security?"]], "tip": "Your boarding pass (tarjeta de embarque) shows your gate (puerta), seat (asiento) and boarding time. Arrive two hours before an international flight.", "roleplay": [{"who": "Ana (viajera)", "scenario": "You are a traveller.", "steps": ["Say: ‘Quisiera facturar.’", "Show your passport.", "Ask: ‘¿Cuál es la puerta?’"]}, {"who": "Tomás (agente)", "scenario": "You are the check-in agent.", "steps": ["Ask for the passport.", "Ask: ‘¿Tiene equipaje para facturar?’", "Give the boarding pass and the gate."]}]}, {"n": 23, "title": "En el avión", "sub": "On the Plane", "part": [4, "Cómo moverse"], "warm": [["¿Te gusta sentarte junto a la ventana?", "Do you like sitting by the window?"], ["¿Qué haces en un avión?", "What do you do on a plane?"]], "words": [["asiento", "/aˈsjento/", "seat", "Mi asiento es el 14A."], ["cinturón", "/sintuˈɾon/", "seat belt", "Abróchese el cinturón de seguridad."], ["auxiliar de vuelo", "/awksiˈljaɾ de ˈbwelo/", "flight attendant", "La auxiliar de vuelo es amable."], ["ventanilla", "/bentaˈniʝa/", "window", "Quiero un asiento de ventanilla."], ["despegar", "/despeˈgaɾ/", "to take off", "El avión va a despegar pronto."], ["aterrizar", "/ateriˈsaɾ/", "to land", "Vamos a aterrizar a las cinco."], ["agua", "/ˈagwa/", "water", "¿Puedo tomar agua?"], ["manta", "/ˈmanta/", "blanket", "Tengo frío. Una manta, por favor."]], "dialogue": [["Emma (pasajera)", "Disculpe, ¿dónde está el asiento 14A?"], ["Samuel (auxiliar de vuelo)", "Está aquí, junto a la ventanilla. Siéntese, por favor."], ["Emma (pasajera)", "Gracias. Tengo frío. ¿Me da una manta?"], ["Samuel (auxiliar de vuelo)", "Claro. Abróchese el cinturón, por favor."], ["Emma (pasajera)", "Bien. ¿Cuándo despega el avión?"], ["Samuel (auxiliar de vuelo)", "En diez minutos. ¿Quiere agua o jugo?"], ["Emma (pasajera)", "Agua, por favor. ¿Cuándo aterrizamos?"], ["Samuel (auxiliar de vuelo)", "En dos horas. ¡Buen viaje!"]], "phrases": [["¿Dónde está mi asiento?", "Where is my seat?"], ["¿Me da una manta?", "Can I have a blanket?"], ["Agua, por favor.", "Water, please."], ["¿Cuándo aterrizamos?", "When do we land?"], ["¿Puedo cambiar de asiento?", "Can I change seats?"], ["No me siento bien.", "I don’t feel well."]], "tip": "‘Asiento de ventanilla’ is a window seat and ‘asiento de pasillo’ is an aisle seat. Use ‘Disculpe’ to get a flight attendant’s attention.", "roleplay": [{"who": "Emma (pasajera)", "scenario": "You are a passenger.", "steps": ["Ask: ‘¿Dónde está mi asiento?’", "Ask for a blanket and water.", "Ask: ‘¿Cuándo aterrizamos?’"]}, {"who": "Samuel (auxiliar de vuelo)", "scenario": "You are the flight attendant.", "steps": ["Show the seat.", "Ask: ‘¿Agua o jugo?’", "Say when you land."]}]}, {"n": 24, "title": "En la estación de tren", "sub": "At the Train Station", "part": [4, "Cómo moverse"], "warm": [["¿Te gusta viajar en tren?", "Do you like travelling by train?"], ["¿Dónde está la estación de tren más cercana?", "Where is the nearest train station?"]], "words": [["andén", "/anˈden/", "platform", "El tren sale del andén cuatro."], ["horario", "/oˈɾaɾjo/", "timetable", "Revise el horario, por favor."], ["boleto de ida", "/boˈleto de ˈida/", "single ticket", "Un boleto de ida a París, por favor."], ["boleto de ida y vuelta", "/boˈleto de ˈida i ˈbwelta/", "return ticket", "Un boleto de ida y vuelta es más barato."], ["retrasado", "/retɾaˈsado/", "delayed", "Son treinta minutos tarde. El tren está retrasado."], ["sale", "/ˈsale/", "it leaves", "El tren sale a las nueve."], ["llega", "/ˈʝega/", "it arrives", "El tren llega al mediodía."], ["cambiar de tren", "/kamˈbjaɾ de tɾen/", "to change trains", "Tengo que cambiar de tren en Lyon."]], "dialogue": [["Tomás (pasajero)", "Hola. Un boleto a Sevilla, por favor."], ["Ana (taquillera)", "¿De ida o de ida y vuelta?"], ["Tomás (pasajero)", "De ida y vuelta, por favor. ¿Cuándo sale el próximo tren?"], ["Ana (taquillera)", "A las diez y cuarto, del andén cuatro."], ["Tomás (pasajero)", "¿Y a qué hora llega?"], ["Ana (taquillera)", "A las doce y media. Pero está retrasado diez minutos."], ["Tomás (pasajero)", "No hay problema. ¿Cuánto cuesta?"], ["Ana (taquillera)", "Treinta pesos. ¡Buen viaje!"]], "phrases": [["Un boleto de ida y vuelta, por favor.", "A return ticket, please."], ["¿Cuándo sale el próximo tren?", "When does the next train leave?"], ["¿Qué andén?", "Which platform?"], ["¿Es este el tren a ...?", "Is this the train to ...?"], ["El tren está retrasado.", "The train is delayed."], ["¿Este tren para en ...?", "Does this train stop at ...?"]], "tip": "‘De ida’ = one-way, ‘de ida y vuelta’ = return. ‘Salir’ (to leave) and ‘llegar’ (to arrive) are key travel verbs: el tren sale, el tren llega.", "roleplay": [{"who": "Tomás (pasajero)", "scenario": "You buy a train ticket.", "steps": ["Ask for a return ticket.", "Ask: ‘¿Cuándo sale el próximo tren?’", "Ask: ‘¿Qué andén?’"]}, {"who": "Ana (taquillera)", "scenario": "You are the ticket clerk.", "steps": ["Ask: ‘¿De ida o de ida y vuelta?’", "Say the time and the platform.", "Say the price."]}]}, {"n": 25, "title": "En el hotel", "sub": "At the Hotel", "part": [5, "Viajes y lugares"], "warm": [["¿Te gustan los hoteles?", "Do you like hotels?"], ["¿Qué necesitas en un buen hotel?", "What do you need in a good hotel?"]], "words": [["reserva", "/reˈseɾba/", "reservation", "Tengo una reserva."], ["habitación doble", "/abitaˈsjon ˈdoble/", "double room", "Una habitación doble, por favor."], ["noche", "/ˈnotʃe/", "night", "¿Cuánto cuesta una noche?"], ["llave", "/ˈʝabe/", "key", "Aquí tiene la llave de su habitación."], ["piso", "/ˈpiso/", "floor", "Su habitación está en el tercer piso."], ["desayuno", "/desaˈʝuno/", "breakfast", "¿Está incluido el desayuno?"], ["ascensor", "/asenˈsoɾ/", "lift", "El ascensor está a la izquierda."], ["wifi", "/ˈwifi/", "Wi-Fi", "¿Cuál es la contraseña del wifi?"]], "dialogue": [["Mía (huésped)", "Buenas noches. Tengo una reserva a nombre de Mía Brown."], ["Leo (recepcionista)", "Bienvenida, señora Brown. Una habitación doble para tres noches."], ["Mía (huésped)", "Correcto. ¿Está incluido el desayuno?"], ["Leo (recepcionista)", "Sí, de siete a diez. Aquí tiene su llave."], ["Mía (huésped)", "Gracias. ¿En qué piso está mi habitación?"], ["Leo (recepcionista)", "En el quinto piso. El ascensor está a su izquierda."], ["Mía (huésped)", "¿Y cuál es la contraseña del wifi?"], ["Leo (recepcionista)", "Está en la tarjeta. ¡Que disfrute su estancia!"]], "phrases": [["Tengo una reserva.", "I have a reservation."], ["Una habitación doble para dos noches.", "A double room for two nights."], ["¿Está incluido el desayuno?", "Is breakfast included?"], ["¿A qué hora es la salida?", "What time is check-out?"], ["¿Cuál es la contraseña del wifi?", "What is the Wi-Fi password?"], ["¿Puedo salir más tarde?", "Can I check out later?"]], "tip": "Check-in (‘la entrada’) is usually in the afternoon and check-out (‘la salida’) in the morning. You can leave your luggage at reception.", "roleplay": [{"who": "Mía (huésped)", "scenario": "You arrive at a hotel.", "steps": ["Say: ‘Tengo una reserva.’", "Ask: ‘¿Está incluido el desayuno?’", "Ask: ‘¿Cuál es la contraseña del wifi?’"]}, {"who": "Leo (recepcionista)", "scenario": "You are the receptionist.", "steps": ["Ask for the name.", "Give the key and the room number.", "Say the breakfast time."]}]}, {"n": 26, "title": "Problemas en el hotel", "sub": "Hotel Problems", "part": [5, "Viajes y lugares"], "warm": [["¿Qué problemas puedes tener en un hotel?", "What problems can you have in a hotel?"], ["¿Qué le dices al recepcionista?", "What do you say to the receptionist?"]], "words": [["problema", "/pɾoˈblema/", "problem", "Tengo un problema. ¿Puede ayudarme?"], ["descompuesto", "/deskomˈpwesto/", "broken", "El aire acondicionado está descompuesto."], ["ruidoso", "/rwiˈdoso/", "noisy", "Mi cuarto es muy ruidoso. No puedo dormir."], ["toalla", "/toˈaʝa/", "towel", "Necesito una toalla limpia."], ["agua caliente", "/ˈagwa kaˈljente/", "hot water", "No hay agua caliente en la ducha."], ["arreglar", "/areˈglaɾ/", "to fix", "¿Puede arreglar la tele?"], ["otra habitación", "/ˈotɾa abitaˈsjon/", "another room", "¿Puedo tener otra habitación, por favor?"], ["lo siento", "/lo ˈsjento/", "I'm sorry", "Lo siento mucho por el problema."]], "dialogue": [["Samuel (huésped)", "Disculpe, tengo un problema en la habitación 305."], ["Ana (recepcionista)", "Lo siento mucho. ¿Cuál es el problema?"], ["Samuel (huésped)", "El aire acondicionado está descompuesto. Hace mucho calor."], ["Ana (recepcionista)", "Enviaré a alguien para arreglarlo ahora mismo."], ["Samuel (huésped)", "Además, no hay agua caliente."], ["Ana (recepcionista)", "¡Ay no! Le doy otra habitación."], ["Samuel (huésped)", "Muy bien. ¿Puede darme también una toalla?"], ["Ana (recepcionista)", "Claro. Habitación 412. Aquí tiene la llave."]], "phrases": [["Tengo un problema.", "I have a problem."], ["No funciona.", "It doesn’t work."], ["No hay agua caliente.", "There is no hot water."], ["¿Puede arreglarlo, por favor?", "Can you fix it, please?"], ["¿Puedo tener otra habitación?", "Can I have another room?"], ["Gracias por su ayuda.", "Thank you for your help."]], "tip": "Stay calm and polite: ‘Disculpe, hay un problema con...’ works better than complaining. ‘No hay’ means ‘there is no / there are no’.", "roleplay": [{"who": "Samuel (huésped)", "scenario": "Your hotel room has problems.", "steps": ["Say: ‘Tengo un problema.’", "Explain two problems.", "Ask for another room."]}, {"who": "Ana (recepcionista)", "scenario": "You are the receptionist.", "steps": ["Say sorry: ‘Lo siento mucho.’", "Ask: ‘¿Cuál es el problema?’", "Offer help or another room."]}]}, {"n": 27, "title": "Turismo", "sub": "Sightseeing", "part": [5, "Viajes y lugares"], "warm": [["¿Qué lugares famosos hay en tu ciudad?", "What famous places are in your city?"], ["¿Te gusta sacar fotos?", "Do you like taking photos?"]], "words": [["museo", "/muˈseo/", "museum", "El museo abre a las nueve."], ["visita guiada", "/biˈsita ˈgjada/", "guided tour", "Hacemos una visita guiada por la ciudad vieja."], ["guía", "/ˈgia/", "guide", "La guía habla inglés."], ["foto", "/ˈfoto/", "photo", "¿Puede sacarnos una foto?"], ["castillo", "/kasˈtiʝo/", "castle", "El castillo es muy antiguo."], ["playa", "/ˈplaʝa/", "beach", "Nadamos en la playa."], ["famosa", "/faˈmosa/", "famous", "Esta iglesia es famosa."], ["abre", "/ˈabɾe/", "it opens", "¿A qué hora abre la catedral?"]], "dialogue": [["Emma (turista)", "Disculpe, ¿hay una buena visita guiada por la ciudad?"], ["Tomás (oficina de turismo)", "¡Sí! Hay una a las diez. Dura dos horas."], ["Emma (turista)", "¿Cuánto cuesta?"], ["Tomás (oficina de turismo)", "Cuesta quince pesos. La guía habla inglés."], ["Emma (turista)", "¡Genial! ¿Qué podemos ver?"], ["Tomás (oficina de turismo)", "El castillo antiguo, el museo y la plaza famosa."], ["Emma (turista)", "¿Puede sacarme una foto, por favor?"], ["Tomás (oficina de turismo)", "¡Claro! ¡Sonría!"]], "phrases": [["¿Qué hay para ver?", "What is there to see?"], ["¿A qué hora abre?", "What time does it open?"], ["¿Cuánto cuesta la visita?", "How much is the tour?"], ["¿Puede sacarnos una foto?", "Can you take a photo of us?"], ["¡Es precioso!", "It’s beautiful!"], ["¿Dónde está la oficina de turismo?", "Where is the tourist office?"]], "tip": "‘Hay’ asks and says what exists: ‘¿Hay un museo?’ ‘Hay dos museos.’ It is the same word for singular and plural.", "roleplay": [{"who": "Emma (turista)", "scenario": "You are a tourist.", "steps": ["Ask: ‘¿Qué hay para ver?’", "Ask: ‘¿Cuánto cuesta la visita?’", "Ask for a photo."]}, {"who": "Tomás (oficina de turismo)", "scenario": "You work at the tourist office.", "steps": ["Suggest three places.", "Say the price and the time.", "Take a photo."]}]}, {"n": 28, "title": "En el banco", "sub": "$", "part": [5, "Viajes y lugares"], "warm": [["¿Usas efectivo o tarjeta?", "Do you use cash or a card?"], ["¿Dónde está el banco más cercano?", "Where is the nearest bank?"]], "words": [["banco", "/ˈbanko/", "bank", "¿Hay un banco por aquí?"], ["dinero", "/diˈneɾo/", "money", "Necesito dinero."], ["cambiar", "/kamˈbjaɾ/", "to exchange", "Quiero cambiar euros."], ["cajero automático", "/kaˈxeɾo awtoˈmatiko/", "ATM", "¿Dónde hay un cajero automático?"], ["cuenta", "/ˈkwenta/", "account", "Quiero abrir una cuenta."], ["tipo de cambio", "/ˈtipo de ˈkambjo/", "exchange rate", "¿Cuál es el tipo de cambio hoy?"], ["firmar", "/fiɾˈmaɾ/", "to sign", "Tiene que firmar aquí."], ["monedas", "/moˈnedas/", "coins", "Tengo algunas monedas."]], "dialogue": [["Leo (cliente)", "Hola. Quiero cambiar euros a pesos."], ["Mía (empleada)", "Claro. ¿Cuánto dinero tiene?"], ["Leo (cliente)", "Tengo doscientos euros. ¿Cuál es el tipo de cambio hoy?"], ["Mía (empleada)", "Hoy un euro son veinte pesos."], ["Leo (cliente)", "Muy bien. Aquí está mi pasaporte."], ["Mía (empleada)", "Gracias. Tiene que firmar aquí."], ["Leo (cliente)", "¿Hay un cajero automático cerca?"], ["Mía (empleada)", "Sí, está afuera, junto a la puerta."]], "phrases": [["Quisiera cambiar ...", "I would like to exchange ..."], ["¿Cuál es el tipo de cambio?", "What is the exchange rate?"], ["¿Dónde está el cajero automático?", "Where is the ATM?"], ["Quisiera abrir una cuenta.", "I would like to open an account."], ["¿Puede darme billetes más pequeños?", "Can you give me smaller notes?"], ["Mi tarjeta no funciona.", "My card doesn’t work."]], "tip": "The exchange rate (‘el tipo de cambio’) changes every day. Compare banks and exchange offices, and always bring your passport.", "roleplay": [{"who": "Leo (cliente)", "scenario": "You need to exchange money.", "steps": ["Say: ‘Quisiera cambiar ...’", "Ask: ‘¿Cuál es el tipo de cambio?’", "Ask: ‘¿Dónde hay un cajero automático?’"]}, {"who": "Mía (empleada)", "scenario": "You are the bank clerk.", "steps": ["Ask: ‘¿Cuánto dinero tiene?’", "Say the rate.", "Ask A to sign."]}]}, {"n": 29, "title": "En el médico", "sub": "At the Doctor", "part": [5, "Viajes y lugares"], "warm": [["¿Cuándo vas al médico?", "When do you go to the doctor?"], ["¿Te sientes bien hoy?", "Do you feel well today?"]], "words": [["médico", "/ˈmediko/", "doctor", "Necesito ver a un médico."], ["dolor de cabeza", "/doˈloɾ de kaˈbesa/", "headache", "Tengo dolor de cabeza."], ["fiebre", "/ˈfjebɾe/", "fever", "Ella tiene mucha fiebre."], ["tos", "/tos/", "cough", "Tengo una tos fuerte."], ["estómago", "/esˈtomago/", "stomach", "Me duele el estómago."], ["dolor de garganta", "/doˈloɾ de gaɾˈganta/", "sore throat", "Tengo dolor de garganta."], ["cita", "/ˈsita/", "appointment", "Tengo una cita a las diez."], ["medicina", "/mediˈsina/", "medicine", "Tome esta medicina dos veces al día."]], "dialogue": [["Samuel (paciente)", "Buenos días, doctora. No me siento bien."], ["Ana (doctora)", "¿Qué le pasa?"], ["Samuel (paciente)", "Me duele la cabeza y la garganta."], ["Ana (doctora)", "¿Tiene fiebre?"], ["Samuel (paciente)", "Sí, un poco. Y tengo tos."], ["Ana (doctora)", "Abra la boca, por favor. Diga ‘Ah’."], ["Samuel (paciente)", "Ah... ¿Es grave?"], ["Ana (doctora)", "No, es solo un resfriado. Descanse, tome agua y esta medicina."]], "phrases": [["No me siento bien.", "I don’t feel well."], ["Tengo dolor de cabeza.", "I have a headache."], ["Me duele ...", "My ... hurts."], ["Tengo fiebre.", "I have a fever."], ["¿Cada cuánto la tomo?", "How often do I take it?"], ["¿Es grave?", "Is it serious?"]], "tip": "Say ‘Tengo dolor de cabeza’ (I have a headache) but ‘Me duele la espalda’ (my back hurts). With ‘me duele’ use el / la: me duele el estómago.", "roleplay": [{"who": "Samuel (paciente)", "scenario": "You don’t feel well.", "steps": ["Say: ‘No me siento bien.’", "Say two problems: ‘Tengo ...’", "Ask: ‘¿Es grave?’"]}, {"who": "Ana (doctora)", "scenario": "You are the doctor.", "steps": ["Ask: ‘¿Qué le pasa?’", "Ask: ‘¿Tiene fiebre?’", "Give advice."]}]}, {"n": 30, "title": "En la farmacia", "sub": "At the Pharmacy", "part": [5, "Viajes y lugares"], "warm": [["¿Qué hay en tu botiquín?", "What’s in your medicine cabinet?"], ["¿Dónde está la farmacia más cercana?", "Where is the nearest pharmacy?"]], "words": [["farmacia", "/faɾˈmasja/", "pharmacy", "¿Hay una farmacia por aquí?"], ["pastillas", "/pasˈtiʝas/", "pills", "Tomo dos pastillas al día."], ["crema", "/ˈkɾema/", "cream", "Necesito una crema para la piel."], ["jarabe", "/xaˈɾabe/", "syrup", "Necesito jarabe para la tos."], ["receta", "/reˈseta/", "prescription", "¿Tiene receta médica?"], ["venda", "/ˈbenda/", "bandage", "Necesito una venda."], ["alérgico", "/aˈleɾxiko/", "allergic", "Soy alérgico a las nueces."], ["dos veces al día", "/dos ˈbeses al ˈdia/", "twice a day", "Tómelo dos veces al día."]], "dialogue": [["Tomás (cliente)", "Hola. Tengo tos y dolor de garganta."], ["Mía (farmacéutica)", "Tengo un buen jarabe para usted."], ["Tomás (cliente)", "¡Genial! ¿Necesito receta?"], ["Mía (farmacéutica)", "No, no la necesita. ¿Es alérgico a algo?"], ["Tomás (cliente)", "No, no soy alérgico. ¿Cómo lo tomo?"], ["Mía (farmacéutica)", "Una cucharada, dos veces al día."], ["Tomás (cliente)", "¿Tiene también pastillas para el dolor de cabeza?"], ["Mía (farmacéutica)", "Sí, aquí tiene. Son doce pesos."]], "phrases": [["¿Tiene algo para ...?", "Do you have something for ...?"], ["Tengo tos.", "I have a cough."], ["¿Necesito receta?", "Do I need a prescription?"], ["¿Cada cuánto lo tomo?", "How often do I take it?"], ["Soy alérgico/a a ...", "I’m allergic to ..."], ["¿Me da una venda, por favor?", "Can I have a bandage, please?"]], "tip": "‘Dos veces al día’ means twice a day. Read the label: it says how many pills to take (‘tome una pastilla’) and when.", "roleplay": [{"who": "Tomás (cliente)", "scenario": "You need medicine.", "steps": ["Say what is wrong.", "Ask: ‘¿Necesito receta?’", "Ask: ‘¿Cómo lo tomo?’"]}, {"who": "Mía (farmacéutica)", "scenario": "You are the pharmacist.", "steps": ["Suggest a medicine.", "Ask: ‘¿Es alérgico a algo?’", "Say how to take it."]}]}, {"n": 31, "title": "Hacer planes e invitar", "sub": "Making Plans & Invitations", "part": [6, "Vida social y trabajo"], "warm": [["¿Qué haces los fines de semana?", "What do you do at weekends?"], ["¿A quién invitas a tu cumpleaños?", "Who do you invite to your birthday?"]], "words": [["invitar", "/inbiˈtaɾ/", "to invite", "Quiero invitar a mis amigos a cenar."], ["plan", "/plan/", "plan", "¿Tienes algún plan para el sábado?"], ["libre", "/ˈlibɾe/", "free", "¿Estás libre el sábado?"], ["ocupado", "/okuˈpado/", "busy", "Lo siento, estoy ocupado esta noche."], ["encontrarnos", "/enkonˈtɾaɾnos/", "to meet up", "Vamos a encontrarnos a las seis."], ["venir", "/beˈniɾ/", "to come", "¿Puedes venir a la fiesta?"], ["quizás", "/kiˈsas/", "maybe", "No estoy seguro. Quizás la próxima vez."], ["buena idea", "/ˈbwena iˈdea/", "good idea", "¡Es una buena idea!"]], "dialogue": [["Ana", "Leo, ¿estás libre el sábado?"], ["Leo", "Creo que sí. ¿Por qué?"], ["Ana", "¡Quiero invitarte a mi fiesta de cumpleaños!"], ["Leo", "¡Qué bien! ¿A qué hora es?"], ["Ana", "Empieza a las siete. ¿Puedes venir?"], ["Leo", "¡Sí, me encantaría! ¿Dónde es?"], ["Ana", "En mi casa. Vamos a encontrarnos en la parada a las seis."], ["Leo", "¡Perfecto! ¡Nos vemos el sábado!"]], "phrases": [["¿Estás libre el ...?", "Are you free on ...?"], ["¿Te gustaría ...?", "Would you like to ...?"], ["¡Me encantaría!", "I’d love to!"], ["Lo siento, no puedo. Estoy ocupado/a.", "Sorry, I can’t. I’m busy."], ["Quizás la próxima vez.", "Maybe next time."], ["Vamos a encontrarnos a las ...", "Let’s meet at ..."]], "tip": "To accept: ‘¡Me encantaría!’ To refuse politely: ‘Lo siento, no puedo. Estoy ocupado/a.’ Then add ‘¡Quizás la próxima vez!’", "roleplay": [{"who": "Ana", "scenario": "You invite a friend.", "steps": ["Ask: ‘¿Estás libre el ...?’", "Invite your friend.", "Say the time and the place."]}, {"who": "Leo", "scenario": "You are the friend.", "steps": ["Say if you are free.", "Ask: ‘¿A qué hora?’", "Accept, or say ‘Lo siento, no puedo.’"]}]}, {"n": 32, "title": "Hablar por teléfono", "sub": "Talking on the Phone", "part": [6, "Vida social y trabajo"], "warm": [["¿Hablas mucho por teléfono?", "Do you talk on the phone a lot?"], ["¿A quién llamas todos los días?", "Who do you call every day?"]], "words": [["llamar", "/ʝaˈmaɾ/", "to call", "Te voy a llamar más tarde."], ["hablar con", "/aˈblaɾ kon/", "to speak to", "¿Puedo hablar con el señor Verde?"], ["un momento", "/un moˈmento/", "one moment", "Un momento, por favor."], ["mensaje", "/menˈsaxe/", "message", "¿Puedo dejar un mensaje?"], ["número equivocado", "/ˈnumeɾo ekiboˈkado/", "wrong number", "Lo siento, número equivocado."], ["colgar", "/kolˈgaɾ/", "to hang up", "No quiero colgar todavía."], ["repetir", "/repeˈtiɾ/", "to repeat", "Perdón, ¿puede repetir eso?"], ["luego", "/ˈlwego/", "later", "¡Hablamos luego!"]], "dialogue": [["Mía", "¿Aló? ¿Puedo hablar con Samuel, por favor?"], ["Samuel", "¡Con él habla! Hola, Mía. ¿Cómo estás?"], ["Mía", "¡Hola, Samuel! Muy bien. ¿Estás ocupado ahora?"], ["Samuel", "Un momento, por favor. Hay mucho ruido en el autobús."], ["Mía", "Está bien, puedo esperar."], ["Samuel", "¡Perdón! Ahora estoy en un lugar tranquilo."], ["Mía", "¿Puedes venir a mi casa a las seis?"], ["Samuel", "¡Sí! Te llamo cuando llegue."]], "phrases": [["Hola, habla ...", "Hello, this is ..."], ["¿Puedo hablar con ...?", "Can I speak to ...?"], ["Un momento, por favor.", "One moment, please."], ["¿Puedo dejar un mensaje?", "Can I leave a message?"], ["Perdón, ¿puede repetir?", "Sorry, can you repeat that?"], ["¡Hablamos luego!", "Talk to you later!"]], "tip": "On the phone say ‘Habla Mía’ or ‘Soy Mía’. Ask ‘¿Quién habla?’ to find out who is calling. ‘Aló’, ‘Bueno’ or ‘Diga’ are used to answer the phone, depending on the country.", "roleplay": [{"who": "Mía", "scenario": "You call a friend.", "steps": ["Say: ‘Hola, ¿puedo hablar con ...?’", "Ask a question.", "Say ‘¡Hablamos luego!’"]}, {"who": "Samuel", "scenario": "You answer the phone.", "steps": ["Say ‘¡Con él / ella habla!’", "Answer A’s question.", "Say goodbye."]}]}, {"n": 33, "title": "Hablar del trabajo", "sub": "Talking About Jobs", "part": [6, "Vida social y trabajo"], "warm": [["¿Cuál es tu trabajo ideal?", "What is your dream job?"], ["¿Dónde trabajas o estudias?", "Where do you work or study?"]], "words": [["trabajo", "/tɾaˈbaxo/", "job", "¿Cuál es tu trabajo?"], ["trabajar", "/tɾabaˈxaɾ/", "to work", "Me gusta trabajar en equipo."], ["empresa", "/emˈpɾesa/", "company", "Él trabaja para una empresa grande."], ["jefe", "/ˈxefe/", "boss", "Mi jefe es muy amable."], ["enfermera", "/enfeɾˈmeɾa/", "nurse", "Ella es enfermera en un hospital."], ["ingeniero", "/inxeˈnjeɾo/", "engineer", "Mi hermano es ingeniero."], ["reunión", "/rewˈnjon/", "meeting", "Tengo una reunión a las diez."], ["tiempo completo", "/ˈtjempo komˈpleto/", "full-time", "Trabajo a tiempo completo."]], "dialogue": [["Tomás", "¿A qué te dedicas, Emma?"], ["Emma", "Soy enfermera. Trabajo en un hospital."], ["Tomás", "¡Qué bien! ¿Te gusta?"], ["Emma", "Sí, me encanta ayudar a la gente. ¿Y tú?"], ["Tomás", "Soy ingeniero. Trabajo para una empresa grande."], ["Emma", "¿Tu jefe es amable?"], ["Tomás", "Sí, lo es. ¡Pero tengo muchas reuniones!"], ["Emma", "¡Ja! Las reuniones son aburridas."]], "phrases": [["¿A qué te dedicas?", "What do you do?"], ["Soy ...", "I am a ..."], ["Trabajo en ...", "I work in ..."], ["Trabajo para ...", "I work for ..."], ["¿Te gusta tu trabajo?", "Do you like your job?"], ["Trabajo de lunes a viernes.", "I work from Monday to Friday."]], "tip": "In Spanish we say ‘Soy enfermera’ without ‘a’ (I’m a nurse). Jobs often change with gender: enfermero / enfermera, ingeniero / ingeniera, profesor / profesora.", "roleplay": [{"who": "Tomás", "scenario": "You meet someone new.", "steps": ["Ask: ‘¿A qué te dedicas?’", "Ask: ‘¿Te gusta tu trabajo?’", "Say what you do."]}, {"who": "Emma", "scenario": "You answer questions about your job.", "steps": ["Say your job and where you work.", "Say if you like it.", "Ask about A’s job."]}]}, {"n": 34, "title": "En una fiesta", "sub": "At a Party", "part": [6, "Vida social y trabajo"], "warm": [["¿Te gustan las fiestas?", "Do you like parties?"], ["¿Qué llevas a una fiesta?", "What do you bring to a party?"]], "words": [["fiesta", "/ˈfjesta/", "party", "¡Bienvenido a mi fiesta!"], ["música", "/ˈmusika/", "music", "La música está muy alta."], ["bailar", "/bajˈlaɾ/", "to dance", "¡Vamos a bailar!"], ["bebida", "/beˈbida/", "drink", "¿Quieres una bebida?"], ["aperitivo", "/apeɾiˈtibo/", "snack", "Toma un aperitivo de la mesa."], ["regalo", "/reˈgalo/", "gift", "Este regalo es para ti."], ["diversión", "/dibeɾˈsjon/", "fun", "Hay mucha diversión."], ["salud", "/saˈlud/", "cheers", "Decimos ¡salud! y sonreímos."]], "dialogue": [["Emma (anfitriona)", "¡Hola, Samuel! ¡Bienvenido a mi fiesta!"], ["Samuel (invitado)", "¡Gracias por invitarme! Este regalo es para ti."], ["Emma (anfitriona)", "¡Ay, gracias! ¿Quieres algo de beber?"], ["Samuel (invitado)", "Sí, un jugo, por favor. ¡La música está genial!"], ["Emma (anfitriona)", "¡Gracias! Hay aperitivos en la mesa."], ["Samuel (invitado)", "¡Qué rico! ¿Quién es esa chica?"], ["Emma (anfitriona)", "Es mi amiga Mía. ¡Vamos a saludarla!"], ["Samuel (invitado)", "¡Buena idea! ¡Y después vamos a bailar!"]], "phrases": [["¡Gracias por invitarme!", "Thanks for inviting me!"], ["Esto es para ti.", "This is for you."], ["¿Quieres algo de beber?", "Would you like something to drink?"], ["¿Te traigo algo?", "Can I get you something?"], ["¡Salud!", "Cheers!"], ["¡Lo pasé genial!", "I had a great time!"]], "tip": "At the end of a party say ‘¡Lo pasé genial! Gracias por todo.’ (I had a great time. Thanks for everything.)", "roleplay": [{"who": "Emma (anfitriona)", "scenario": "You are the host.", "steps": ["Welcome your guest.", "Offer a drink and a snack.", "Introduce a friend."]}, {"who": "Samuel (invitado)", "scenario": "You are the guest.", "steps": ["Say thanks and give a gift.", "Say something nice about the party.", "Say ‘¡Lo pasé genial!’"]}]}, {"n": 35, "title": "Entrevista de trabajo", "sub": "Job Interview", "part": [7, "Trabajo y servicios"], "warm": [["¿Te gustan las entrevistas de trabajo?", "Do you like job interviews?"], ["¿En qué eres bueno/a?", "What are you good at?"]], "words": [["entrevista", "/entɾeˈbista/", "interview", "Hoy tengo una entrevista de trabajo."], ["currículum", "/kuˈrikulum/", "CV / résumé", "Aquí está mi currículum."], ["experiencia", "/ekspeˈɾjensja/", "experience", "Tengo dos años de experiencia."], ["habilidades", "/abiliˈdades/", "skills", "Tengo buenas habilidades con la computadora."], ["equipo", "/eˈkipo/", "team", "Me gusta trabajar en equipo."], ["sueldo", "/ˈsweldo/", "salary", "¿Cuál es el sueldo?"], ["disponible", "/dispoˈnible/", "available", "Estoy disponible desde el lunes."], ["empezar", "/empeˈsaɾ/", "to start", "¿Puede empezar la próxima semana?"]], "dialogue": [["Emma (candidata)", "Buenos días. Vengo para la entrevista."], ["Tomás (entrevistador)", "Buenos días, Emma. Siéntese. ¿Trae su currículum?"], ["Emma (candidata)", "Sí, aquí lo tiene. Gracias por recibirme."], ["Tomás (entrevistador)", "Hábleme de su experiencia."], ["Emma (candidata)", "Trabajé cinco años como enfermera."], ["Tomás (entrevistador)", "Muy bien. ¿Cuáles son sus mejores habilidades?"], ["Emma (candidata)", "Soy organizada y me gusta trabajar en equipo."], ["Tomás (entrevistador)", "Excelente. ¿Puede empezar el lunes?"]], "phrases": [["Gracias por recibirme.", "Thank you for seeing me."], ["Tengo ... años de experiencia.", "I have ... years of experience."], ["Soy bueno/a en ...", "I am good at ..."], ["Me gusta trabajar en equipo.", "I like working in a team."], ["Estoy disponible desde ...", "I am available from ..."], ["¿Cuándo tendré noticias suyas?", "When will I hear from you?"]], "tip": "Give full answers: ‘Trabajé cinco años como enfermera’ is better than ‘Cinco años’. In interviews use usted (formal): ‘Gracias por recibirme’.", "roleplay": [{"who": "Emma (candidata)", "scenario": "You are at a job interview.", "steps": ["Say hello and thank the interviewer.", "Talk about your experience.", "Say when you are available."]}, {"who": "Tomás (entrevistador)", "scenario": "You are the interviewer.", "steps": ["Ask: ‘Hábleme de su experiencia.’", "Ask: ‘¿Cuáles son sus habilidades?’", "Ask: ‘¿Cuándo puede empezar?’"]}]}, {"n": 36, "title": "Conocer a los compañeros", "sub": "Meeting Colleagues", "part": [7, "Trabajo y servicios"], "warm": [["¿Trabajas en una oficina?", "Do you work in an office?"], ["¿Qué dices el primer día de trabajo?", "What do you say on your first day at work?"]], "words": [["compañera", "/kompaˈɲeɾa/", "colleague", "Ana es mi nueva compañera."], ["escritorio", "/eskɾiˈtoɾjo/", "desk", "Este es tu escritorio."], ["correo", "/koˈreo/", "email", "Te envío un correo."], ["impresora", "/impɾeˈsoɾa/", "printer", "La impresora está junto a la puerta."], ["sala de reuniones", "/ˈsala de rewˈnjones/", "meeting room", "La reunión es en la sala de reuniones."], ["pausa para el café", "/ˈpawsa paɾa el kaˈfe/", "coffee break", "Hagamos una pausa para el café."], ["gerente", "/xeˈɾente/", "manager", "Nuestra gerente se llama la señora Hill."], ["bienvenido", "/bjenbeˈnido/", "welcome", "¡Bienvenido al equipo!"]], "dialogue": [["Ana (compañera)", "¡Hola! Tú debes de ser Samuel. ¡Bienvenido al equipo!"], ["Samuel (empleado nuevo)", "Gracias, Ana. Es mi primer día."], ["Ana (compañera)", "Este es tu escritorio, junto a la ventana."], ["Samuel (empleado nuevo)", "Es perfecto. ¿Dónde está la impresora?"], ["Ana (compañera)", "Está junto a la puerta. La sala de reuniones está a la izquierda."], ["Samuel (empleado nuevo)", "Genial. ¿Cuándo es la pausa para el café?"], ["Ana (compañera)", "A las once. Te muestro la cocina."], ["Samuel (empleado nuevo)", "¡Gracias! Todos son muy amables."]], "phrases": [["¡Bienvenido al equipo!", "Welcome to the team!"], ["Es mi primer día.", "It’s my first day."], ["¿Dónde está la impresora?", "Where is the printer?"], ["Te envío un correo.", "I’ll send you an email."], ["Hagamos una pausa para el café.", "Let’s have a coffee break."], ["¿Quién es el gerente?", "Who is the manager?"]], "tip": "Small talk builds good relationships. Ask ‘¿Cómo estuvo tu fin de semana?’ on Monday and ‘¿Qué planes tienes para el fin de semana?’ on Friday.", "roleplay": [{"who": "Ana (compañera)", "scenario": "You are a colleague.", "steps": ["Welcome the new person.", "Show the desk and the printer.", "Invite him or her for a coffee."]}, {"who": "Samuel (empleado nuevo)", "scenario": "You are the new employee.", "steps": ["Say it is your first day.", "Ask where things are.", "Say thank you."]}]}, {"n": 37, "title": "Pedir una cita", "sub": "Making an Appointment", "part": [7, "Trabajo y servicios"], "warm": [["¿Usas una agenda o el teléfono para tus citas?", "Do you use a diary or your phone for appointments?"], ["¿Cuándo estás libre esta semana?", "When are you free this week?"]], "words": [["cita", "/ˈsita/", "appointment", "Quisiera pedir una cita."], ["reservar", "/reseɾˈbaɾ/", "to book", "Quisiera reservar una mesa."], ["la próxima semana", "/la ˈpɾoksima seˈmana/", "next week", "¿Está libre la próxima semana?"], ["conveniente", "/konbeˈnjente/", "convenient", "¿Le es conveniente el martes?"], ["reprogramar", "/repɾogɾaˈmaɾ/", "to reschedule", "¿Puedo reprogramar mi cita?"], ["confirmar", "/konfiɾˈmaɾ/", "to confirm", "¿Puede confirmar por correo?"], ["cancelar", "/kanseˈlaɾ/", "to cancel", "Lo siento, tengo que cancelar."], ["deletrear", "/deletɾeˈaɾ/", "to spell", "¿Puede deletrear su apellido?"]], "dialogue": [["Mía (quien llama)", "Hola. Quisiera pedir una cita, por favor."], ["Leo (recepcionista)", "Claro. ¿Le es conveniente la próxima semana?"], ["Mía (quien llama)", "Sí. ¿Tiene algo el martes?"], ["Leo (recepcionista)", "Tengo a las diez o a las dos y media."], ["Mía (quien llama)", "A las dos y media es perfecto."], ["Leo (recepcionista)", "¿Me da su nombre y su número de teléfono?"], ["Mía (quien llama)", "Mía Brown. Mi número es 555 0123."], ["Leo (recepcionista)", "Gracias. ¡La esperamos el martes a las dos y media!"]], "phrases": [["Quisiera pedir una cita.", "I would like to make an appointment."], ["¿Le es conveniente el martes?", "Is Tuesday convenient for you?"], ["¿Tiene algo el ...?", "Do you have anything on ...?"], ["¿Puedo reprogramarla?", "Can I reschedule it?"], ["Lo siento, tengo que cancelar.", "Sorry, I have to cancel."], ["¿Puede confirmarlo por correo?", "Can you confirm it by email?"]], "tip": "To sound polite and professional use usted and the conditional: ‘Quisiera pedir una cita’, ‘¿Podría reprogramarla?’", "roleplay": [{"who": "Mía (quien llama)", "scenario": "You want to book an appointment.", "steps": ["Say what you want.", "Choose a day and a time.", "Give your name and phone number."]}, {"who": "Leo (recepcionista)", "scenario": "You work at reception.", "steps": ["Ask: ‘¿Le es conveniente la próxima semana?’", "Offer two times.", "Confirm the day and the time."]}]}, {"n": 38, "title": "Alquilar un departamento", "sub": "Renting a Flat", "part": [7, "Trabajo y servicios"], "warm": [["¿Vives en un departamento o en una casa?", "Do you live in a flat or a house?"], ["¿Qué es importante en un nuevo hogar?", "What is important in a new home?"]], "words": [["alquiler", "/alkiˈleɾ/", "rent", "¿Cuánto es el alquiler?"], ["amueblado", "/amweˈblado/", "furnished", "¿El departamento está amueblado?"], ["depósito", "/deˈposito/", "deposit", "El depósito es un mes de alquiler."], ["gastos", "/ˈgastos/", "bills (utilities)", "¿Están incluidos los gastos?"], ["contrato", "/konˈtɾato/", "contract", "Por favor, firme el contrato."], ["visita", "/biˈsita/", "viewing", "¿Puedo concertar una visita?"], ["propietario", "/pɾopjeˈtaɾjo/", "landlord", "El propietario vive arriba."], ["al mes", "/al mes/", "per month", "Cuesta novecientos pesos al mes."]], "dialogue": [["Leo (inquilino)", "Hola. Llamo por el departamento en alquiler."], ["Ana (agente)", "Sí, es un departamento de dos dormitorios en el centro."], ["Leo (inquilino)", "¿Cuánto es el alquiler?"], ["Ana (agente)", "Son novecientos pesos al mes."], ["Leo (inquilino)", "¿Están incluidos los gastos?"], ["Ana (agente)", "No, no lo están. Pero está amueblado."], ["Leo (inquilino)", "Perfecto. ¿Puedo concertar una visita?"], ["Ana (agente)", "Claro. ¿Qué tal mañana a las cinco?"]], "phrases": [["Llamo por el departamento.", "I’m calling about the flat."], ["¿Cuánto es el alquiler?", "How much is the rent?"], ["¿Están incluidos los gastos?", "Are the bills included?"], ["¿Está amueblado?", "Is it furnished?"], ["¿Puedo concertar una visita?", "Can I arrange a viewing?"], ["¿Cuánto es el depósito?", "How much is the deposit?"]], "tip": "‘Departamento’ is common in Latin America; in Spain people say ‘piso’. Always read the contract (‘el contrato’) before you sign it.", "roleplay": [{"who": "Leo (inquilino)", "scenario": "You are looking for a flat.", "steps": ["Say why you are calling.", "Ask about the rent and the bills.", "Ask for a viewing."]}, {"who": "Ana (agente)", "scenario": "You are the letting agent.", "steps": ["Describe the flat.", "Say the price and what is included.", "Offer a day and a time."]}]}, {"n": 39, "title": "En el gimnasio", "sub": "At the Gym", "part": [7, "Trabajo y servicios"], "warm": [["¿Practicas algún deporte?", "Do you do any sport?"], ["¿Con qué frecuencia haces ejercicio?", "How often do you exercise?"]], "words": [["gimnasio", "/ximˈnasjo/", "gym", "Voy al gimnasio tres veces por semana."], ["membresía", "/membɾeˈsia/", "membership", "Quisiera una membresía."], ["entrenador", "/entɾenaˈdoɾ/", "trainer", "Mi entrenador es muy amable."], ["cinta de correr", "/ˈsinta de koˈreɾ/", "treadmill", "Corro en la cinta de correr."], ["pesas", "/ˈpesas/", "weights", "Levanto pesas los viernes."], ["estirar", "/estiˈɾaɾ/", "to stretch", "Siempre hay que estirar después del ejercicio."], ["casillero", "/kasiˈʝeɾo/", "locker", "Deja tu bolso en el casillero."], ["clase", "/ˈklase/", "class", "Hay una clase de yoga a las seis."]], "dialogue": [["Tomás (socio nuevo)", "Hola, quisiera inscribirme en el gimnasio. ¿Cuánto cuesta la membresía?"], ["Mía (recepcionista)", "Son treinta pesos al mes. ¿Quiere una visita guiada?"], ["Tomás (socio nuevo)", "Sí, por favor. ¿Qué equipo tienen?"], ["Mía (recepcionista)", "Tenemos cintas de correr, pesas y una piscina."], ["Tomás (socio nuevo)", "¡Genial! ¿Hay clases?"], ["Mía (recepcionista)", "Sí, yoga a las seis y spinning a las siete."], ["Tomás (socio nuevo)", "¿Dónde puedo dejar mi bolso?"], ["Mía (recepcionista)", "En un casillero. Sígame, se lo muestro."]], "phrases": [["Quisiera inscribirme en el gimnasio.", "I’d like to join the gym."], ["¿Cuánto cuesta la membresía?", "How much is membership?"], ["¿A qué hora abren?", "What time do you open?"], ["¿Hay clases?", "Are there any classes?"], ["¿Puedo hacer una visita guiada?", "Can I have a tour?"], ["Quisiera un entrenador personal.", "I’d like a personal trainer."]], "tip": "Say ‘ir al gimnasio’, ‘hacer yoga’, ‘jugar al fútbol’ and ‘salir a correr’. Different sports use different verbs: hacer, jugar or ir.", "roleplay": [{"who": "Tomás (socio nuevo)", "scenario": "You want to join a gym.", "steps": ["Ask about the price.", "Ask what equipment there is.", "Ask about classes."]}, {"who": "Mía (recepcionista)", "scenario": "You work at the gym.", "steps": ["Say the price.", "Show the equipment.", "Tell A about the classes."]}]}, {"n": 40, "title": "Quejarse con cortesía", "sub": "Complaining Politely", "part": [7, "Trabajo y servicios"], "warm": [["¿Te quejas cuando algo está mal?", "Do you complain when something is wrong?"], ["¿Qué dices?", "What do you say?"]], "words": [["queja", "/ˈkexa/", "complaint", "Quisiera presentar una queja."], ["equivocado", "/ekiboˈkado/", "wrong", "Este es el tamaño equivocado."], ["defectuoso", "/defekˈtwoso/", "faulty", "Este secador de pelo es defectuoso."], ["reembolso", "/reemˈbolso/", "refund", "Quisiera un reembolso, por favor."], ["devolver", "/debolˈbeɾ/", "to return", "Quisiera devolver esta chaqueta."], ["reemplazar", "/reemplaˈsaɾ/", "to replace", "¿Pueden reemplazar este producto?"], ["decepcionada", "/desepsjoˈnada/", "disappointed", "Estoy muy decepcionada."], ["disculparnos", "/diskulˈpaɾnos/", "to apologise", "Queremos disculparnos por el problema."]], "dialogue": [["Ana (clienta)", "Disculpe, quisiera presentar una queja."], ["Samuel (vendedor)", "Lo siento mucho. ¿Cuál es el problema?"], ["Ana (clienta)", "Este secador de pelo es defectuoso. No funciona."], ["Samuel (vendedor)", "¿Tiene el recibo?"], ["Ana (clienta)", "Sí, lo compré la semana pasada. Aquí tiene."], ["Samuel (vendedor)", "Gracias. Queremos disculparnos por el problema."], ["Ana (clienta)", "¿Puedo tener un reembolso o pueden reemplazarlo?"], ["Samuel (vendedor)", "Por supuesto. Le traigo uno nuevo ahora mismo."]], "phrases": [["Quisiera presentar una queja.", "I would like to make a complaint."], ["No funciona.", "It doesn’t work."], ["Quisiera devolver esto.", "I would like to return this."], ["¿Puedo tener un reembolso?", "Can I have a refund?"], ["¿Puede reemplazarlo?", "Can you replace it?"], ["Estoy muy decepcionada.", "I’m very disappointed."]], "tip": "To complain politely, start with ‘Disculpe’ or ‘Perdone, hay un problema’, explain calmly, then say what you want: ‘Quisiera un reembolso.’", "roleplay": [{"who": "Ana (clienta)", "scenario": "You bought a faulty product.", "steps": ["Explain the problem politely.", "Show the receipt.", "Ask for a refund or a new one."]}, {"who": "Samuel (vendedor)", "scenario": "You work in the shop.", "steps": ["Say sorry.", "Ask for the receipt.", "Offer a refund or a replacement."]}]}], "pro": {"es": ["NOTA DE LA AUTORA", "Prólogo", ["Querido estudiante:", "Me llamo Priscila y soy la fundadora de Verbal Academy, una academia de idiomas en línea. Hace más de quince años que enseño idiomas, y este libro es el resultado de todos esos años en el aula.", "Muchos adultos estudian español durante mucho tiempo. Conocen las palabras. Conocen las reglas de gramática. Pero cuando llega el momento de hablar, en un restaurante, en un aeropuerto o en una reunión, se quedan en blanco. El español está en su cabeza, pero no sale de su boca.", "La razón es sencilla: no aprendemos a hablar solo leyendo y escuchando. Aprendemos a hablar hablando. Esta idea es el corazón de este libro y por eso su título es Habla hablando.", "En estas páginas encontrarás 40 situaciones de la vida real, desde saludar hasta una entrevista de trabajo. Cada tema te ofrece las palabras que necesitas, un breve cómic con una conversación, frases útiles y un juego de roles para representar. Para cada palabra nueva también encontrarás su pronunciación (IPA) y su traducción al inglés, para que siempre entiendas lo que aprendes y cómo decirlo.", "Por favor, no te limites a leer este libro. Dilo en voz alta. Grábate. Practica con un amigo, con un profesor o frente al espejo. Equivocarse es normal y valioso en el aprendizaje. Quince minutos todos los días valen más que una larga clase una vez por semana.", "Gracias por confiar en Verbal Academy para aprender español. Espero que este libro te dé la confianza para abrir la boca y empezar.", "Con cariño,", "Priscila FUNDADORA, VERBAL ACADEMY"]], "en": ["A NOTE FROM THE AUTHOR", "Prologue", ["Dear learner,", "My name is Priscila, and I am the founder of Verbal Academy, an online language academy. I have been teaching languages for more than fifteen years, and this book is the result of all those years in the classroom.", "Many adults study Spanish for a long time. They know the words. They know the grammar rules. But when the moment arrives to speak, in a restaurant, at an airport or in a meeting, they freeze. The Spanish is in their heads, but it does not come out of their mouths.", "The reason is simple: we do not learn to speak by only reading and listening. We learn to speak by speaking. This idea is the heart of the book, and it is why its title is Habla hablando (Speak by Speaking).", "In these pages you will find 40 real-life situations, from saying hello to a job interview. Every topic gives you the words you need, a short comic conversation, useful phrases and a role-play to act out. For each new word you will also find its pronunciation (IPA) and its English translation, so you always understand what you are learning and how to say it.", "Please do not only read this book. Say it out loud. Record your voice. Practise with a friend, with a teacher or in front of the mirror. Make mistakes: they are a normal and valuable part of learning. Fifteen minutes every day is better than one long lesson once a week.", "Thank you for trusting Verbal Academy with your Spanish. I hope this book gives you the confidence to open your mouth and begin.", "With all my best wishes,", "Priscila FOUNDER, VERBAL ACADEMY"]]}, "back": {"sigue": "¡Sigue hablando! Hablar un idioma es una habilidad: cuanto más practiques, más fácil será. Vuelve a tus diálogos favoritos, represéntalos otra vez e inventa tus propias conversaciones."}};
