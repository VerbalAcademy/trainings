<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emoji Tales · Verbal Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f0;--sf:#fff;--ink:#14232b;--mut:#4d5f66;--mar:#6b1218;--tl:#17698a;--ln:#cfdad5;--in:#f3f7f5;--btn:#0e5d7d;--bt:#fff;--t1:rgba(23,105,138,.09);--t2:rgba(107,18,24,.08);--ok:#0b7a48;--chip:#fff3cf;--chipb:#d9a400;--wd:#dff3e8;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a1c;--sf:#152628;--ink:#e8f0ee;--mut:#9fb3b0;--mar:#f0a3a8;--tl:#6cc4e6;--ln:#2a4144;--in:#0f1f21;--btn:#6cc4e6;--bt:#04202b;--ok:#5ad19a;--chip:#3a3314;--wd:#14382a}}
:root[data-theme="dark"]{--bg:#0d1a1c;--sf:#152628;--ink:#e8f0ee;--mut:#9fb3b0;--mar:#f0a3a8;--tl:#6cc4e6;--ln:#2a4144;--in:#0f1f21;--btn:#6cc4e6;--bt:#04202b;--ok:#5ad19a;--chip:#3a3314;--wd:#14382a}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:1.05rem/1.6 "Atkinson Hyperlegible",system-ui,sans-serif}
:focus-visible{outline:3px solid var(--tl);outline-offset:2px}
h1,h2,h3,summary{font-family:"Bricolage Grotesque",system-ui,sans-serif}
.cover{position:relative;overflow:hidden;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 20px 0;background:#17698a}
.tartan{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover>*:not(.tartan){position:relative;z-index:1}
.logo{background:#fbfcfa;border-radius:28px;padding:18px 26px;box-shadow:0 8px 30px rgba(0,0,0,.14)}
.logo img{display:block;width:min(420px,72vw);height:auto}
.panel{background:#384b8a;color:#fff;border-radius:28px;padding:26px 34px 30px;max-width:620px;margin-top:26px;box-shadow:0 10px 34px rgba(0,0,0,.28)}
.panel h1{font-size:clamp(2.1rem,6.5vw,3.8rem);line-height:1.05;font-weight:800;color:#fff;margin:0 0 6px}
.panel .brand{font:800 1.3rem "Bricolage Grotesque",sans-serif;color:#dfe8ff;margin:0 0 12px}
.panel p{color:#dfe8ff;margin:0 auto 20px;max-width:40ch}
.btn{font:700 1rem "Bricolage Grotesque",sans-serif;background:var(--btn);color:var(--bt);border:0;border-radius:999px;padding:10px 22px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.alt{background:transparent;color:var(--tl);border:2px solid var(--tl)}
.panel .btn{background:#fff;color:#384b8a}
.go{display:flex;align-items:center;justify-content:center;gap:18px}.deer-s{height:64px;width:auto}
.bob{animation:bob 3s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){.bob{animation:none}html{scroll-behavior:auto}}
.pf{margin-top:22px;padding-top:12px;border-top:1px solid var(--ln);text-align:center;color:var(--mut);font-size:.88rem}
.cover .pf{background:#384b8a;color:#fff;border-radius:22px 22px 0 0;padding:8px 26px;margin-top:auto;border-top:0;position:relative;z-index:3}
main{max-width:860px;margin:0 auto;padding:56px 16px 24px}
main h2{font-size:2.2rem;color:var(--mar);margin:0 0 6px}
.sub{color:var(--mut);margin:0 0 14px}
.idx{list-style:none;counter-reset:i;padding:0;margin:14px 0 40px;display:grid;gap:8px}
.idx li{counter-increment:i}
.idx a{display:flex;align-items:center;gap:14px;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:10px 18px;color:var(--ink);text-decoration:none;font:800 1.1rem "Bricolage Grotesque",sans-serif}
.idx a::before{content:counter(i);background:var(--mar);color:#fff;border-radius:50%;min-width:2.1rem;height:2.1rem;display:grid;place-items:center;font-size:1rem}
.idx a span{margin-left:auto;font-size:1.5rem;letter-spacing:.1em}
.idx a:hover{border-color:var(--tl)}
details.les{background:var(--sf);border:1px solid var(--ln);border-radius:14px;margin:12px 0}
summary{cursor:pointer;padding:16px 20px;font-weight:800;font-size:1.25rem;display:flex;align-items:center;gap:14px;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";margin-left:auto;font-size:1.6rem;color:var(--tl)}
details[open]>summary::after{content:"–"}
details[open]>summary{border-bottom:1px solid var(--ln)}
.num{background:var(--mar);color:#fff;border-radius:50%;min-width:2.1rem;height:2.1rem;display:grid;place-items:center;font-size:1rem}
.body{padding:8px 22px 22px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.tools .btn{padding:8px 18px;font-size:.95rem}
.story{font-size:1.25rem;line-height:2;margin:10px 0 6px}
.story p{margin:0 0 .5rem}
.em{display:inline-block;font-size:1.8rem;line-height:1;padding:2px 8px;margin:0 2px;border-radius:12px;background:var(--chip);border:2px dashed var(--chipb);cursor:pointer;vertical-align:middle}
.em.word{font:700 1.15rem "Atkinson Hyperlegible",sans-serif;background:var(--wd);border:2px solid var(--ok);padding:3px 10px}
.em:active{transform:scale(1.12)}
.body h3{font-size:1.3rem;color:var(--mar);margin:1.4em 0 .4em}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:1rem}
th,td{border:1px solid var(--ln);padding:8px 12px;text-align:left}
th{background:var(--in);color:var(--mar);font-family:"Bricolage Grotesque",sans-serif}
td.e{font-size:1.7rem;text-align:center;width:4rem}td.es{font-weight:700;color:var(--mar)}td.en{color:var(--tl);font-weight:700}
td.s{width:4rem;text-align:center}td.s button{border:0;background:var(--btn);color:var(--bt);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:1rem}
.back{display:inline-block;margin-top:16px;color:var(--tl);font-weight:700}
</style></head><body>

<script>
// token: {emoji|Spanish word|English}
var TALES=[
{t:"Jimmy and the Apple",p:[
"Jimmy is a small {🦊|the fox|el zorro}. Today he is very hungry.",
"Jimmy sees a very big {🌳|the tree|el árbol}. There is a red {🍎|the apple|la manzana} in the tree. How pretty!",
"Jimmy jumps and jumps, but he can’t reach it. A {🐝|the bee|la abeja} comes.",
"“Hello, Jimmy,” says the bee. “I fly and you eat.”",
"The bee flies and the apple falls. Plop! Jimmy and the bee eat together under the {☀️|the sun|el sol}. Jimmy is very happy."]},
{t:"Tina’s Moon",p:[
"Tina is a white {🐱|the cat|la gata}. She lives in a blue {🏠|the house|la casa}.",
"Every night Tina looks at the {🌙|the moon|la luna}. “I want the moon!” she says.",
"Tina climbs the tallest {🌳|the tree|el árbol}, but the moon is far away.",
"A little {⭐|the star|la estrella} says: “Tina, I am near. I am your friend.”",
"Tina smiles and sleeps happily."]},
{t:"Tom’s Bread",p:[
"Tom is an orange {🐟|the fish|el pez}. He lives in the blue {💧|the water|el agua} of a river.",
"One day Tom sees some {🍞|the bread|el pan} in the water. He is very hungry.",
"A {🦆|the duck|el pato} comes. “It’s mine!” says the duck.",
"Tom thinks and says: “Let’s share, friend.”",
"The fish and the duck eat together. They both have a very big {❤️|the heart|el corazón}."]}
];
var RE=/\{([^|}]+)\|([^|}]+)\|([^}]+)\}/g,ART=/^(the|a|an)\s/i;
var VOICE=null;
function pickVoice(){
  try{
    var best=-99;VOICE=null;
    speechSynthesis.getVoices().forEach(function(v){
      if(!/^en/i.test(v.lang))return;
      var sc=0,nm=v.name;
      if(/en[-_]GB/i.test(v.lang))sc+=4;else if(/en[-_](US|AU|IE)/i.test(v.lang))sc+=2;
      if(/serena|kate|stephanie|hazel|sonia|libby|susan|samantha|karen|moira|tessa|fiona|female|woman/i.test(nm))sc+=5;
      if(/daniel|arthur|george|ryan|thomas|oliver|james|alex|fred|rishi|male|man\b/i.test(nm)&&!/female|woman/i.test(nm))sc-=8;
      if(sc>best){best=sc;VOICE=v}
    });
  }catch(e){}
}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function speak(t){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang=VOICE?VOICE.lang:"en-GB";if(VOICE)u.voice=VOICE;u.rate=.85;u.pitch=1.25;speechSynthesis.speak(u)}catch(e){}}
function plain(s){return s.replace(RE,function(m,e,w){return w.replace(ART,"")})}
var book=document.getElementById("book"),idx=document.getElementById("idx");
TALES.forEach(function(tale,i){
  var id="cuento-"+(i+1),words=[],show=false;
  tale.p.forEach(function(par){var m;RE.lastIndex=0;while((m=RE.exec(par)))words.push(m)});
  var li=document.createElement("li"),a=document.createElement("a");
  a.href="#"+id;a.innerHTML=tale.t+"<span>"+words.slice(0,4).map(function(m){return m[1]}).join("")+"</span>";
  a.onclick=function(){var d=document.getElementById(id);d.open=true};
  li.appendChild(a);idx.appendChild(li);
  var d=document.createElement("details");d.className="les";d.id=id;
  d.innerHTML='<summary><span class="num">'+(i+1)+'</span>'+tale.t+'</summary>';
  var b=document.createElement("div");b.className="body";
  var tools=document.createElement("div");tools.className="tools";
  var b1=document.createElement("button");b1.className="btn";b1.textContent="🔊 Escuchar el cuento";
  b1.onclick=function(){speak(tale.p.map(plain).join(" "))};
  var b2=document.createElement("button");b2.className="btn alt";b2.textContent="👀 Ver las palabras";
  tools.appendChild(b1);tools.appendChild(b2);b.appendChild(tools);
  var story=document.createElement("div");story.className="story";b.appendChild(story);
  function render(){
    story.innerHTML="";
    tale.p.forEach(function(par){
      var p=document.createElement("p"),last=0,m;RE.lastIndex=0;
      while((m=RE.exec(par))){
        p.appendChild(document.createTextNode(par.slice(last,m.index)));
        var s=document.createElement("span");s.className="em"+(show?" word":"");s.tabIndex=0;s.setAttribute("role","button");
        s.textContent=show?m[2].replace(ART,""):m[1];s.setAttribute("aria-label",m[2]);
        (function(w){s.onclick=function(){speak(w.replace(ART,""))};s.onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();speak(w.replace(ART,""))}}})(m[2]);
        p.appendChild(s);last=RE.lastIndex;
      }
      p.appendChild(document.createTextNode(par.slice(last)));story.appendChild(p);
    });
  }
  b2.onclick=function(){show=!show;b2.textContent=show?"🙈 Ver los emojis":"👀 Ver las palabras";render()};
  render();
  var h=document.createElement("h3");h.textContent="Words in the tale";b.appendChild(h);
  var w=document.createElement("div");w.className="tw";
  var rows=words.map(function(m,k){return '<tr><td class="e">'+m[1]+'</td><td class="es">'+m[2]+'</td><td class="en">'+m[3]+'</td><td class="s"><button type="button" data-w="'+m[2]+'" aria-label="Listen: '+m[2]+'">🔊</button></td></tr>'}).join("");
  w.innerHTML='<table><tr><th></th><th>English</th><th>Español</th><th>Sonido</th></tr>'+rows+'</table>';
  w.addEventListener("click",function(e){var t=e.target.closest("button");if(t)speak(t.dataset.w.replace(ART,""))});
  b.appendChild(w);
  var back=document.createElement("a");back.className="back";back.href="#indice";back.textContent="↑ Back to index";b.appendChild(back);
  d.appendChild(b);book.appendChild(d);
});
